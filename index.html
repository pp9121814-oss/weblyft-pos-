    a.innerHTML=`<div class="wrap"><div class="card"><h2>WEBLYFT error</h2><p>${esc(e.message||"Unknown error")}</p><button class="btn primary" onclick="location.reload()">RELOAD</button></div></div>`;

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* WEBLYFT FINAL HTML APP
   - Phone-first responsive UI
   - Owner/POS/Kitchen/Tables/QR/Menu/Reports/Settings/Subscription
   - Customer QR menu + cart + tax + range check
   - Browser-local data store for standalone HTML operation
   - QR generation uses QRCode.js CDN. Internet is required for QR generation in this single-file build.
*/
const KEY="WEBLYFT_FINAL_V1";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{restaurants:[],orders:[],session:null};
let page="dashboard",cart=[],pcat="All",pq="";
const SUPABASE_URL="https://gpolqilwfxgssxrixpqe.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_c-xQEXAygNy1J8_0YXNjwg_f2Lu-xJe";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const FREE_OWNER_EMAIL = "panwarbudhsingh@gmail.com";
const ADMIN_EMAIL = "panwarbudhsingh@gmail.com";

async function getAuthEmail(){
 try{
   const {data,error}=await sb.auth.getUser();
   if(error)throw error;
   return String(data.user?.email||"").trim().toLowerCase();
 }catch(_){ return ""; }
}
async function isAdminAccountAsync(){
 return (await getAuthEmail())===ADMIN_EMAIL;
}

function isAdminAccount(r){
  if(!r)return false;
  return String(r.email||"").trim().toLowerCase()===ADMIN_EMAIL;
}


function currentOwnerEmail(){
  try{
    const s=sb.auth.getSession;
    const local=JSON.parse(localStorage.getItem(KEY)||"null");
    return String(local?.ownerEmail || current()?.email || "").trim().toLowerCase();
  }catch(_){ return ""; }
}

function accessAllowed(r){ if(!r)return false; const email=String(r.email||"").trim().toLowerCase(); if(email===ADMIN_EMAIL)return true; return r.is_active===true || r.manual_access===true; }
const PROTECTED_PAGES = new Set(["pos","orders","kitchen","tables","menu","inventory","reports","customers"]);

async function cloudRegister(name,owner,email,phone,password,tables){
 const emailClean=email.trim().toLowerCase();
 const {data,error}=await sb.auth.signUp({email:emailClean,password});
 if(error)throw error;
 if(!data.user)throw new Error("No user returned");

 // The profile RPC needs an authenticated session. If Supabase has
 // "Confirm email" enabled, signUp may return no session yet.
 if(!data.session){
   throw new Error("EMAIL_CONFIRM_REQUIRED");
 }

 const {data:p,error:e}=await sb.rpc("create_restaurant_profile",{
   p_name:name,p_owner_name:owner,p_email:emailClean,p_phone:phone,p_table_count:tables
 });
 if(e)throw e;
 return p;
}
async function cloudLogin(email,password){
 const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error)throw error;
 const {data:s,error:se}=await sb.from("staff").select("restaurant_id,name,role,is_active").eq("id",data.user.id).single(); if(se)throw se;
 const {data:r,error:re}=await sb.from("restaurants").select("*").eq("id",s.restaurant_id).single(); if(re)throw re;
 return r;
}
async function loadCloud(r){
 const {data:remoteRestaurant,error:remoteRestaurantError}=await sb
   .from("restaurants")
   .select("*")
   .eq("id",r.id)
   .single();
 if(remoteRestaurantError)throw remoteRestaurantError;
 r.is_active=remoteRestaurant.is_active===true;
 r.manual_access=remoteRestaurant.manual_access===true;
 r.name=remoteRestaurant.name;
 r.email=remoteRestaurant.email;
 r.owner=remoteRestaurant.owner_name;
 r.phone=remoteRestaurant.phone;
 r.tax=Number(remoteRestaurant.tax_percent||0);
 r.range=Number(remoteRestaurant.ordering_radius_m||100);
 r.lat=remoteRestaurant.latitude;
 r.lng=remoteRestaurant.longitude;
 r.code=remoteRestaurant.restaurant_code||r.code||null;

 const [t,m,o,oi]=await Promise.all([
  sb.from("restaurant_tables").select("*").eq("restaurant_id",r.id).order("table_number"),
  sb.from("menu_items").select("*").eq("restaurant_id",r.id).order("created_at"),
  sb.from("orders").select("*").eq("restaurant_id",r.id).order("created_at",{ascending:false}),
  sb.from("order_items").select("*")
]);
 if(t.error)throw t.error;if(m.error)throw m.error;
 if(o.error)throw o.error;
 if(oi.error)throw oi.error;

 r.code=r.code||r.restaurant_code||null;
 r.is_active = r.is_active !== false;
 r.manual_access = r.manual_access === true;
 r.tables=(t.data||[]).map(x=>({
  no:x.table_number,id:x.id,token:x.qr_token,
  status:x.status==="occupied"?"Occupied":x.status==="reserved"?"Reserved":"Available"
 }));
 r.menu=(m.data||[]).map(x=>({
  id:x.id,name:x.name,cat:"Menu",desc:x.description||"",
  price:Number(x.price||0),active:!!x.is_available
 }));

 const tableMap={};
 (t.data||[]).forEach(tb=>tableMap[String(tb.id)]=tb.table_number);
 const itemByOrder={};
 (oi.data||[]).forEach(i=>{
   const key=String(i.order_id);
   (itemByOrder[key] ||= []).push({
     name:i.item_name||i.name||"Item",
     price:Number(i.unit_price||i.price||0),
     qty:Number(i.quantity||i.qty||1)
   });
 });

 const statusMap={
  new:"New",pending:"New",confirmed:"New",
  preparing:"Preparing",ready:"Ready",served:"Served",
  completed:"Served",cancelled:"Cancelled"
 };

 db.orders=(o.data||[]).map(x=>({
   id:x.order_number ?? x.id,
   cloudId:x.id,
   rid:r.id,
   table:x.table_number ?? tableMap[String(x.table_id)] ?? null,
   tableId:x.table_id ?? null,
   items:itemByOrder[String(x.id)]||[],
   subtotal:Number(x.subtotal||0),
   tax:Number(x.tax_amount ?? x.tax ?? 0),
   total:Number(x.total||0),
   status:statusMap[String(x.status||"new").toLowerCase()]||String(x.status||"New"),
   eta:x.eta_minutes ?? x.eta ?? null,
   started:x.started_at?new Date(x.started_at).getTime():null,
   created:x.created_at?new Date(x.created_at).getTime():Date.now(),
   source:x.source||"QR",
   customerName:x.customer_name||""
 }));

 save();
}

async function loadCloudOrders(r){
 const [o,oi]=await Promise.all([
  sb.from("orders").select("*").eq("restaurant_id",r.id).order("created_at",{ascending:false}),
  sb.from("order_items").select("*")
 ]);
 if(o.error)throw o.error;if(oi.error)throw oi.error;

 const tableMap={};
 const {data:tableRows,error:tableError}=await sb.from("restaurant_tables").select("id,table_number").eq("restaurant_id",r.id);
 if(tableError)throw tableError;
 (tableRows||[]).forEach(tb=>tableMap[String(tb.id)]=tb.table_number);
 const byOrder={};
 (oi.data||[]).forEach(i=>{
   const key=String(i.order_id);
   (byOrder[key] ||= []).push({
     name:i.item_name||i.name||"Item",
     price:Number(i.unit_price||i.price||0),
     qty:Number(i.quantity||i.qty||1)
   });
 });

 const statusMap={new:"New",pending:"New",confirmed:"New",preparing:"Preparing",ready:"Ready",served:"Served",completed:"Served",cancelled:"Cancelled"};
 db.orders=(o.data||[]).map(x=>({
   id:x.order_number ?? x.id,cloudId:x.id,rid:r.id,
   table:x.table_number ?? tableMap[String(x.table_id)] ?? null,tableId:x.table_id ?? null,
   items:byOrder[String(x.id)]||[],
   subtotal:Number(x.subtotal||0),
   tax:Number(x.tax_amount ?? x.tax ?? 0),
   total:Number(x.total||0),
   status:statusMap[String(x.status||"new").toLowerCase()]||String(x.status||"New"),
   eta:x.eta_minutes ?? x.eta ?? null,
   started:x.started_at?new Date(x.started_at).getTime():null,
   created:x.created_at?new Date(x.created_at).getTime():Date.now(),
   source:x.source||"QR",
   customerName:x.customer_name||""
 }));
 save();
}

let cloudOrderTimer=null;
function startOrderSync(){
 clearInterval(cloudOrderTimer);
 cloudOrderTimer=setInterval(async()=>{
   const r=current();
   if(!r || !["dashboard","orders","kitchen"].includes(page))return;
   try{
     await loadCloudOrders(r);
     render();
   }catch(e){console.warn("Order sync:",e)}
 },4000);
}


const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const money=n=>"₹"+Math.round(n||0).toLocaleString("en-IN");
const rid=()=>`WL-${Math.floor(100000+Math.random()*900000)}`;
const token=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36)+Date.now().toString(36);

async function register(){
 const btn=document.querySelector('button[onclick="register()"]');
 if(btn?.disabled)return;
 if(!rn.value||!ro.value||!re.value||!rpass.value)return alert("Fill all required fields.");
 if(rpass.value.length<6)return alert("Password must be at least 6 characters.");
 if(btn){btn.disabled=true;btn.textContent="CREATING ACCOUNT…";}
 try{
  const r=await cloudRegister(rn.value.trim(),ro.value.trim(),re.value.trim(),rp.value.trim(),rpass.value,+nt.value||12);
  db.session=r.id;
  db.restaurants=db.restaurants.filter(x=>x.id!==r.id);
  db.restaurants.push({
    id:r.id,name:r.name,owner:r.owner_name,email:r.email,phone:r.phone,
    tax:r.tax_percent,range:r.ordering_radius_m,lat:r.latitude,lng:r.longitude,
    manual_access:r.manual_access===true,is_active:r.is_active===true,tables:[],menu:[]
  });
  db.ownerEmail=r.email||"";
  save(); await loadCloud(current()); owner();
 }catch(e){
  if(e.message==="EMAIL_CONFIRM_REQUIRED"){
   alert("Account created, but Supabase is waiting for email confirmation.\n\nFor this WEBLYFT setup, open Supabase → Authentication → Sign In / Providers → Confirm email and turn it OFF, then try registration again.");
  }else{
   alert("Registration failed: "+(e.message||"Unknown error"));
  }
  if(btn){btn.disabled=false;btn.textContent="CREATE ACCOUNT";}
 }
}

 save();

 try{

function toggleSide(force){

window.__openAdminControl=async function(){
  try{
    const email=await getAuthEmail();
    if(email!==ADMIN_EMAIL){
      alert(`Admin access only: ${ADMIN_EMAIL}`);
      return;
    }
    closeMobileNav();
    page="admin";
    const r=current();
    if(!r){
      auth();
      return;
    }
    // Render the Admin page directly; no subscription/access gate is involved.
    const target=$("main");
    if(!target){
      owner();
      return;
    }
    const view=await admin();
    target.innerHTML=view;
    await loadAdmin();
  }catch(e){
    console.error(e);
    const target=$("main");
    if(target)target.innerHTML=`<div class="card"><div class="notice">Admin Control error: ${esc(e.message||e)}</div></div>`;
    else alert("Admin Control error: "+(e.message||e));
  }
};

function go(p){
 closeMobileNav();
 if(p==="admin"){
  isAdminAccountAsync().then(ok=>{
    if(!ok){alert(`Admin access only: ${ADMIN_EMAIL}`);return;}
    page="admin";owner();
  });
  return;
}
 if(PROTECTED_PAGES.has(p) && !accessAllowed(current())){
   page="dashboard";
   owner();
   return;
 }
 page=p;
 owner();
}
function render(){
 let f={dashboard,pos,orders,kitchen,tables,menu,inventory,reports,customers,settings,admin}[page];
 if(typeof f!=="function"){
   main.innerHTML=accessLockedPage();
   return;
 }
 let out=f();
 if(out instanceof Promise){
   out.then(x=>main.innerHTML=x);
 }else{
   main.innerHTML=out;
   if(page==="menu")renderMenuCloud();
   if(page==="admin")loadAdmin();
 }
}

function addCart(id){let m=current().menu.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({...m,qty:1});render()}
async function sendPOS(){
 if(!cart.length)return alert("Cart is empty.");
 const r=current(), tableNo=+pt.value;
 const table=r.tables.find(t=>t.no===tableNo);
 if(!table?.id)return alert("Selected table is not connected to Supabase.");

 const sub=cart.reduce((a,x)=>a+x.price*x.qty,0);
 const tax=sub*r.tax/100;
 const total=sub+tax;
 const payload={
  restaurant_id:r.id,
  table_id:table.id,
  source:"pos",
  status:"new",
  subtotal:sub,
  tax_amount:tax,
  total:total,
  customer_name:null,
  customer_note:null
 };
 try{
  const {data,error}=await sb.from("orders").insert(payload).select("*").single();
  if(error)throw error;
  const items=cart.map(x=>({
    order_id:data.id,
    menu_item_id:x.id,
    item_name:x.name,
    quantity:x.qty,
    unit_price:x.price,
    line_total:x.price*x.qty
  }));
  const {error:ie}=await sb.from("order_items").insert(items);
  if(ie)throw ie;
  await sb.from("restaurant_tables").update({status:"occupied"}).eq("id",table.id).eq("restaurant_id",r.id);
  cart=[];
  await loadCloudOrders(r);
  startOrderSync();
  go("orders");
 }catch(e){
  alert("Order could not be sent: "+(e.message||e));
 }
}

${o.map(x=>`<tr><td>#${x.id}</td><td>${x.table}</td><td>${x.items.map(i=>esc(i.name)+" × "+i.qty).join(", ")}</td><td>${money(x.total)}</td><td><span class="status ${x.status==="New"?"new":x.status==="Preparing"?"prep":x.status==="Ready"?"ready":"served"}">${x.status}</span></td><td>
${x.status==="New"?`<button class="btn success" onclick="accept('${esc(String(x.cloudId||x.id))}')">ACCEPT</button>`:x.status==="Preparing"?`<button class="btn primary" onclick="statusOrder('${esc(String(x.cloudId||x.id))}','Ready')">READY</button>`:x.status==="Ready"?`<button class="btn soft" onclick="statusOrder('${esc(String(x.cloudId||x.id))}','Served')">SERVED</button>`:""}</td></tr>`).join("")||"<tr><td colspan=6>No orders</td></tr>"}</table></div>`;

async function accept(id){
 let x=getOrders().find(o=>String(o.id)===String(id)||String(o.cloudId)===String(id));
 if(!x)return;
 let eta=prompt("Chef preparation time (minutes)","20");
 if(eta===null)return;
 const minutes=Math.max(1,+eta||20);
 try{
   const {error}=await sb.from("orders").update({status:"preparing"}).eq("id",x.cloudId).eq("restaurant_id",current().id);
   if(error)throw error;
   await loadCloudOrders(current());
   const nx=getOrders().find(o=>String(o.cloudId)===String(x.cloudId));
   if(nx){nx.eta=minutes;nx.started=Date.now();save();}
   go("kitchen");
 }catch(e){alert("Order update failed: "+(e.message||e));}
}
async function statusOrder(id,s){
 let x=getOrders().find(o=>String(o.id)===String(id)||String(o.cloudId)===String(id));
 if(!x)return;
 const dbStatus={New:"new",Preparing:"preparing",Ready:"ready",Served:"served"}[s]||String(s).toLowerCase();
 try{
   const {error}=await sb.from("orders").update({status:dbStatus}).eq("id",x.cloudId).eq("restaurant_id",current().id);
   if(error)throw error;
   if(s==="Served" && x.tableId){
     await sb.from("restaurant_tables").update({status:"available"}).eq("id",x.tableId).eq("restaurant_id",current().id);
   }
   await loadCloudOrders(current());
   render();
 }catch(e){alert("Order update failed: "+(e.message||e));}
}

function inventoryAdd(){
 open(`<button class="close" onclick="closeModal()">×</button>
   <h2>Add Stock Item</h2>
   <input class=field id=inm placeholder="Item name">
   <input class=field id=inc placeholder="Category (e.g. Dairy)">
   <input class=field id=inq type=number min=0 step=0.01 value="0" placeholder="Current quantity">
   <input class=field id=inmin type=number min=0 step=0.01 value="5" placeholder="Low-stock minimum">
   <input class=field id=incost type=number min=0 step=0.01 value="0" placeholder="Cost per unit">
   <input class=field id=inunit value="pcs" placeholder="Unit (pcs, kg, litre...)">
   <button class="btn primary" style="width:100%" onclick="inventorySave()">SAVE STOCK ITEM</button>`);
}

function inventorySave(){
 const r=current();
 const name=$("inm").value.trim();
 if(!name)return alert("Stock item name required.");
 const item={
   id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),
   name,
   cat:$("inc").value.trim()||"General",
   qty:Math.max(0,Number($("inq").value)||0),
   min:Math.max(0,Number($("inmin").value)||0),
   cost:Math.max(0,Number($("incost").value)||0),
   unit:$("inunit").value.trim()||"pcs",
   updated:Date.now()
 };
 r.inventory=r.inventory||[];
 r.inventory.push(item);
 save();
 closeModal();
 render();
}

function inventoryEdit(id){
 const r=current(),x=(r.inventory||[]).find(i=>String(i.id)===String(id));
 if(!x)return;
 open(`<button class="close" onclick="closeModal()">×</button>
   <h2>Edit Stock Item</h2>
   <input class=field id=inm value="${esc(x.name)}" placeholder="Item name">
   <input class=field id=inc value="${esc(x.cat||"General")}" placeholder="Category">
   <input class=field id=inq type=number min=0 step=0.01 value="${x.qty}" placeholder="Current quantity">
   <input class=field id=inmin type=number min=0 step=0.01 value="${x.min}" placeholder="Low-stock minimum">
   <input class=field id=incost type=number min=0 step=0.01 value="${x.cost}" placeholder="Cost per unit">
   <input class=field id=inunit value="${esc(x.unit||"pcs")}" placeholder="Unit">
   <button class="btn primary" style="width:100%" onclick="inventoryUpdate('${x.id}')">UPDATE STOCK ITEM</button>`);
}

function inventoryUpdate(id){
 const r=current(),x=(r.inventory||[]).find(i=>String(i.id)===String(id));
 if(!x)return;
 const name=$("inm").value.trim();
 if(!name)return alert("Stock item name required.");
 x.name=name;
 x.cat=$("inc").value.trim()||"General";
 x.qty=Math.max(0,Number($("inq").value)||0);
 x.min=Math.max(0,Number($("inmin").value)||0);
 x.cost=Math.max(0,Number($("incost").value)||0);
 x.unit=$("inunit").value.trim()||"pcs";
 x.updated=Date.now();
 save();
 closeModal();
 render();
}

function inventoryAdjust(id,delta){
 const r=current(),x=(r.inventory||[]).find(i=>String(i.id)===String(id));
 if(!x)return;
 x.qty=Math.max(0,(+x.qty||0)+delta);
 x.updated=Date.now();
 save();
 render();
}
function reports(){ if(!accessAllowed(current())){ return accessLockedPage(); }let o=getOrders(),sales=o.reduce((a,x)=>a+x.total,0),tax=o.reduce((a,x)=>a+x.tax,0);return `<div class=head><div><h1>Reports</h1><small class=mut>Restaurant performance</small></div></div><div class=cards><div class="card metric"><small>Total Sales</small><strong>${money(sales)}</strong></div><div class="card metric"><small>Total Orders</small><strong>${o.length}</strong></div><div class="card metric"><small>Tax Collected</small><strong>${money(tax)}</strong></div><div class="card metric"><small>Average Order</small><strong>${money(o.length?sales/o.length:0)}</strong></div><div class="card metric"><small>Tables</small><strong>${current().tables.length}</strong></div></div>`}
function customers(){ if(!accessAllowed(current())){ return accessLockedPage(); }let o=getOrders(),names=[...new Set(o.map(x=>x.name).filter(Boolean))];return `<div class=head><div><h1>Customers</h1><small class=mut>Customer activity</small></div></div><div class=card>${names.length?names.map(n=>`<div class=line><b>${esc(n)}</b><span>Customer</span></div>`).join(""):"<p class=mut>No named customers yet. Customer names are optional at QR checkout.</p>"}</div>`}
function settings(){
 let r=current();
 return `<div class=head><div><h1>Settings</h1><small class=mut>Restaurant + account settings</small></div></div>
 <div class=card style="max-width:760px">
   <h3>Restaurant details</h3>
   <input class=field id=sn value="${esc(r.name||"")}" placeholder="Restaurant name">
   <input class=field id=so value="${esc(r.owner||"")}" placeholder="Owner name">
   <input class=field id=st type=number value="${r.tax||0}" placeholder="Tax %">

   <h3>Change password</h3>
   <p class=mut>Enter your current password, then your new password.</p>
   <input class=field id=curPass type=password placeholder="Current password">

function getLocation(){
 if(!navigator.geolocation)return alert("Geolocation unavailable.");
 navigator.geolocation.getCurrentPosition(
   p=>{slat.value=p.coords.latitude;slng.value=p.coords.longitude},
   ()=>alert("Allow location permission.")
 );
}
async function saveSettings(){
 let r=current();
 const name=sn.value.trim(), ownerName=so.value.trim();
 if(!name)return alert("Restaurant name required.");
 try{
   const {data,error}=await sb.rpc("update_my_profile",{
     p_restaurant_name:name,
     p_owner_name:ownerName,
     p_tax_percent:Math.max(0,+st.value||0),
     p_ordering_radius_m:Math.max(1,+sr.value||100),
     p_latitude:slat.value?+slat.value:null,
     p_longitude:slng.value?+slng.value:null
   });
   if(error)throw error;
   r.name=name;
   r.owner=ownerName;
   r.tax=Math.max(0,+st.value||0);
   r.range=Math.max(1,+sr.value||100);
   r.lat=slat.value?+slat.value:null;
   r.lng=slng.value?+slng.value:null;
   save();
   alert("Restaurant details saved.");
   owner();
 }catch(e){
   alert("Could not save details: "+(e.message||e));
 }
}
async function changePassword(){
 const email=(await getAuthEmail());
 const currentPassword=curPass.value;
 const newPassword=newPass.value;
 const confirmPassword=confirmPass.value;
 if(!email)return alert("Please login again.");
 if(!currentPassword||!newPassword||!confirmPassword)return alert("Fill all password fields.");
 if(newPassword.length<6)return alert("New password must be at least 6 characters.");
 if(newPassword!==confirmPassword)return alert("New passwords do not match.");
 const btn=document.querySelector('button[onclick="changePassword()"]');
 if(btn){btn.disabled=true;btn.textContent="CHANGING PASSWORD…";}
 try{
   const {error:verifyError}=await sb.auth.signInWithPassword({email,password:currentPassword});
   if(verifyError)throw new Error("Current password is incorrect.");
   const {error:updateError}=await sb.auth.updateUser({password:newPassword});
   if(updateError)throw updateError;
   curPass.value="";newPass.value="";confirmPass.value="";
   alert("Password changed successfully.");
 }catch(e){
   alert("Password change failed: "+(e.message||e));
 }finally{
   if(btn){btn.disabled=false;btn.textContent="CHANGE PASSWORD";}
 }
}

async function adminToggle(id,nextActive){
 if(!(await isAdminAccountAsync())){alert(`Admin access only: ${ADMIN_EMAIL}`);return;}
 const action=nextActive?"activate":"deactivate";
 if(!confirm(`Are you sure you want to ${action} this restaurant account?`))return;
 try{
   const {data,error}=await sb.rpc("admin_set_restaurant_active",{p_restaurant_id:id,p_active:nextActive});
   if(error)throw error;
   await loadAdmin();
   alert(`Restaurant ${nextActive?"activated":"deactivated"} successfully.`);
 }catch(e){
   alert("Admin action failed: "+(e.message||e));
 }
}

function accessLockedPage(){ return `<div class=head><div><h1>Account Inactive</h1><small class=mut>Waiting for WEBLYFT Admin activation</small></div></div><div class=card style="max-width:720px"><h2>Access is currently locked</h2><p>Your restaurant account must be activated by WEBLYFT Admin before POS, Orders, Kitchen/KOT, Menu, Tables & QR, Inventory, Reports and Customers become available.</p><div class=notice><b>No subscription is required.</b><br>WEBLYFT access is controlled only by Admin activation.</div></div>`;}

async function customer(){
let p=new URLSearchParams(location.search);
let rid=p.get("rid"),tableNo=Number(p.get("table")),token=p.get("token");
if(!rid||!tableNo||!token){
 $("app").innerHTML=`<div class=wrap><div class=hero><h1>Invalid QR</h1><p>This QR link is missing restaurant or table information.</p></div></div>`;
 return;
}
$("app").innerHTML=`<div class=wrap><div class=card style="text-align:center"><h2>Loading menu…</h2><p class=mut>Connecting to WEBLYFT</p></div></div>`;
try{
 let data,error;
 if(/^WL-/i.test(rid)){
   ({data,error}=await sb.rpc("get_public_qr_menu_by_code",{
     p_restaurant_code:rid,p_table_number:tableNo,p_qr_token:token
   }));
 }else{
   ({data,error}=await sb.rpc("get_public_qr_menu",{
     p_restaurant_id:rid,p_table_number:tableNo,p_qr_token:token
   }));
 }
 if(error)throw error;
 if(!data||!data.restaurant||!data.table)throw new Error("Invalid QR");
  if(data.access_active===false)throw new Error("restaurant_inactive");
 let r={
   id:data.restaurant.id,name:data.restaurant.name,tax:Number(data.restaurant.tax_percent||0),
   range:Number(data.restaurant.ordering_radius_m||100),
   lat:data.restaurant.latitude,lng:data.restaurant.longitude
 };
 let t={no:Number(data.table.table_number),id:data.table.id,token:data.table.qr_token,status:data.table.status};
 r.menu=(data.menu||[]).map(m=>({
   id:m.id,name:m.name,cat:m.category||"Other",desc:m.description||"",
   price:Number(m.price||0),active:!!m.is_available
 }));
 let cc=[],cat="All",qq="",placed=null;

 function renderC(){
  let cats=["All",...new Set(r.menu.map(x=>x.cat))];
  let items=r.menu.filter(x=>x.active&&(cat==="All"||x.cat===cat)&&x.name.toLowerCase().includes(qq.toLowerCase()));
  let sub=cc.reduce((a,x)=>a+x.price*x.qty,0);
  $("app").innerHTML=`<div class=customer><header class=chead><b>${esc(r.name)}</b><small style="display:block;opacity:.75">TABLE ${t.no} • CUSTOMER MENU</small></header><main class=wrap>
  <div class=hero><small>WELCOME</small><h1>Order from your table</h1><p style="margin:0">Your QR is connected to Table ${t.no}.</p></div>
  <input class=search value="${esc(qq)}" placeholder="Search dishes..." oninput="window.__qrSearch(this.value)">
  <div class=tabs>${cats.map(c=>`<button class="${cat===c?'on':''}" onclick="window.__qrCat(${JSON.stringify(c)})">${esc(c)}</button>`).join("")}</div>
  ${items.map(m=>`<div class=citem><div><b>${esc(m.name)}</b><small style="display:block;color:#718096">${esc(m.cat)} • ${esc(m.desc)}</small><strong>${money(m.price)}</strong></div><button class="btn primary" onclick="window.__qrAdd('${m.id}')">ADD</button></div>`).join("")||"<p class=mut>No dishes found.</p>"}</main>
  ${cc.length?`<div class=cartbar><b>${cc.reduce((a,x)=>a+x.qty,0)} items • ${money(sub)}</b><button class=btn style="float:right;background:#fff;color:#0755ca" onclick=window.__qrCheckout()>VIEW CART</button></div>`:""}</div>`;
 }

 window.__qrSearch=v=>{qq=v;renderC()};
 window.__qrCat=v=>{cat=v;renderC()};
 window.__qrAdd=id=>{let m=r.menu.find(x=>String(x.id)===String(id)),x=cc.find(x=>x.id===id);x?x.qty++:cc.push({...m,qty:1});renderC()};

 window.__qrCheckout=()=>{
  let sub=cc.reduce((a,x)=>a+x.price*x.qty,0),tax=sub*r.tax/100;
  open(`<button class=close onclick=closeModal()>×</button><h2>Cart • Table ${t.no}</h2>
  ${cc.map(x=>`<div class=line><span>${esc(x.name)} × ${x.qty}</span><b>${money(x.price*x.qty)}</b></div>`).join("")}
  <div class=line><span>Subtotal</span><b>${money(sub)}</b></div>
  <div class=line><span>Tax (${r.tax}%)</span><b>${money(tax)}</b></div>
  <div class=line><b>Total</b><b>${money(sub+tax)}</b></div>
  <input id=customerName class=field placeholder="Name (optional)">
  <textarea id=customerNote class=field placeholder="Special note"></textarea>
  <button class="btn primary" style="width:100%" onclick=window.__qrPlace()>PLACE ORDER</button>`);
 };

 window.__qrPlace=()=>{
  if(r.lat!==null&&r.lat!==undefined&&navigator.geolocation){
   navigator.geolocation.getCurrentPosition(
    pos=>finishC(pos.coords.latitude,pos.coords.longitude),
    ()=>alert("Location permission is required for ordering from this table.")
   );
  }else finishC(null,null);
 };

 async function finishC(lat,lng){
  if(r.lat!==null&&r.lat!==undefined&&r.lng!==null&&r.lng!==undefined){
   if(lat===null||lng===null)return alert("Location permission is required.");
   let d=distance(r.lat,r.lng,lat,lng);
   if(d>r.range)return alert("You are outside the restaurant's "+r.range+"m ordering range.");
  }
  let sub=cc.reduce((a,x)=>a+x.price*x.qty,0),tax=sub*r.tax/100;
  if(!cc.length)return alert("Your cart is empty.");
  try{
   const {data,error}=await sb.rpc("place_public_order",{
    p_restaurant_id:r.id,
    p_table_id:t.id,
    p_customer_name:$("customerName").value||null,
    p_customer_note:$("customerNote").value||null,
    p_subtotal:sub,
    p_tax_amount:tax,
    p_total:sub+tax,
    p_items:cc.map(x=>({menu_item_id:x.id,item_name:x.name,quantity:x.qty,unit_price:x.price,line_total:x.price*x.qty}))
   });
   if(error)throw error;
   close();
   placed={id:data.order_id,table:t.no,status:"New",eta:null,total:sub+tax};
   trackC();
  }catch(e){alert("Order could not be placed: "+e.message);}
 }

 function trackC(){
  $("app").innerHTML=`<div class=customer><header class=chead><b>${esc(r.name)}</b><small style="display:block">TABLE ${t.no} • ORDER #${esc(placed.id)}</small></header><main class=wrap><div class=card>
  <div class=timeline>${["New","Preparing","Ready","Served"].map((x,i)=>`<div class="node ${i===0?'on':''}" id="node-${i}"><div style="width:20px;height:20px;border-radius:50%;margin:auto;background:${i===0?'#19a66a':'#e3e9ef'}"></div>${x}</div>`).join("")}</div>
  <h2 style="text-align:center">Order received</h2><p class=mut style="text-align:center">Order #${esc(placed.id)} has been sent to the restaurant.</p>
  </div></main></div>`;
 }

 renderC();
}catch(e){
 $("app").innerHTML=`<div class=wrap><div class=hero><h1>Invalid QR</h1><p>This QR is not connected to a valid restaurant table.</p><small>${esc(e.message||"QR validation failed")}</small></div></div>`;
 console.error(e);
}
}

const __params=new URLSearchParams(location.search);
const __customerMode=__params.get("customer")==="1";
if(__customerMode){
  // QR/customer mode NEVER boots the owner account, even if this browser
  // has a previous Supabase/local owner session.
  customer().catch(e=>console.error(e));
}else if(db.session&&current()){
  owner();
}else{
  auth();
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* WEBLYFT FINAL HTML APP
   - Phone-first responsive UI
   - Owner/POS/Kitchen/Tables/QR/Menu/Reports/Settings/Subscription
   - Customer QR menu + cart + tax + range check
   - Browser-local data store for standalone HTML operation
   - QR generation uses QRCode.js CDN. Internet is required for QR generation in this single-file build.
*/
const KEY="WEBLYFT_FINAL_V1";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{restaurants:[],orders:[],session:null};
let page="dashboard",cart=[],pcat="All",pq="";
const SUPABASE_URL="https://gpolqilwfxgssxrixpqe.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_c-xQEXAygNy1J8_0YXNjwg_f2Lu-xJe";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const FREE_OWNER_EMAIL = "panwarbudhsingh@gmail.com";
const ADMIN_EMAIL = "panwarbudhsingh@gmail.com";

async function getAuthEmail(){
 try{
   const {data,error}=await sb.auth.getUser();
   if(error)throw error;
   return String(data.user?.email||"").trim().toLowerCase();
 }catch(_){ return ""; }
}
async function isAdminAccountAsync(){
 return (await getAuthEmail())===ADMIN_EMAIL;
}

function isAdminAccount(r){
  if(!r)return false;
  return String(r.email||"").trim().toLowerCase()===ADMIN_EMAIL;
}


function currentOwnerEmail(){
  try{
    const s=sb.auth.getSession;
    const local=JSON.parse(localStorage.getItem(KEY)||"null");
    return String(local?.ownerEmail || current()?.email || "").trim().toLowerCase();
  }catch(_){ return ""; }
}

function accessAllowed(r){ if(!r)return false; const email=String(r.email||"").trim().toLowerCase(); if(email===ADMIN_EMAIL)return true; return r.is_active===true || r.manual_access===true; }
const PROTECTED_PAGES = new Set(["pos","orders","kitchen","tables","menu","inventory","reports","customers"]);

async function cloudRegister(name,owner,email,phone,password,tables){
 const emailClean=email.trim().toLowerCase();
 const {data,error}=await sb.auth.signUp({email:emailClean,password});
 if(error)throw error;
 if(!data.user)throw new Error("No user returned");

 // The profile RPC needs an authenticated session. If Supabase has
 // "Confirm email" enabled, signUp may return no session yet.
 if(!data.session){
   throw new Error("EMAIL_CONFIRM_REQUIRED");
 }

 const {data:p,error:e}=await sb.rpc("create_restaurant_profile",{
   p_name:name,p_owner_name:owner,p_email:emailClean,p_phone:phone,p_table_count:tables
 });
 if(e)throw e;
 return p;
}
async function cloudLogin(email,password){
 const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error)throw error;
 const {data:s,error:se}=await sb.from("staff").select("restaurant_id,name,role,is_active").eq("id",data.user.id).single(); if(se)throw se;
 const {data:r,error:re}=await sb.from("restaurants").select("*").eq("id",s.restaurant_id).single(); if(re)throw re;
 return r;
}
async function loadCloud(r){
 const {data:remoteRestaurant,error:remoteRestaurantError}=await sb
   .from("restaurants")
   .select("*")
   .eq("id",r.id)
   .single();
 if(remoteRestaurantError)throw remoteRestaurantError;
 r.is_active=remoteRestaurant.is_active===true;
 r.manual_access=remoteRestaurant.manual_access===true;
 r.name=remoteRestaurant.name;
 r.email=remoteRestaurant.email;
 r.owner=remoteRestaurant.owner_name;
 r.phone=remoteRestaurant.phone;
 r.tax=Number(remoteRestaurant.tax_percent||0);
 r.range=Number(remoteRestaurant.ordering_radius_m||100);
 r.lat=remoteRestaurant.latitude;
 r.lng=remoteRestaurant.longitude;
 r.code=remoteRestaurant.restaurant_code||r.code||null;

 const [t,m,o,oi]=await Promise.all([
  sb.from("restaurant_tables").select("*").eq("restaurant_id",r.id).order("table_number"),
  sb.from("menu_items").select("*").eq("restaurant_id",r.id).order("created_at"),
  sb.from("orders").select("*").eq("restaurant_id",r.id).order("created_at",{ascending:false}),
  sb.from("order_items").select("*")
]);
 if(t.error)throw t.error;if(m.error)throw m.error;
 if(o.error)throw o.error;
 if(oi.error)throw oi.error;

 r.code=r.code||r.restaurant_code||null;
 r.is_active = r.is_active !== false;
 r.manual_access = r.manual_access === true;
 r.tables=(t.data||[]).map(x=>({
  no:x.table_number,id:x.id,token:x.qr_token,
  status:x.status==="occupied"?"Occupied":x.status==="reserved"?"Reserved":"Available"
 }));
 r.menu=(m.data||[]).map(x=>({
  id:x.id,name:x.name,cat:"Menu",desc:x.description||"",
  price:Number(x.price||0),active:!!x.is_available
 }));

 const tableMap={};
 (t.data||[]).forEach(tb=>tableMap[String(tb.id)]=tb.table_number);
 const itemByOrder={};
 (oi.data||[]).forEach(i=>{
   const key=String(i.order_id);
   (itemByOrder[key] ||= []).push({
     name:i.item_name||i.name||"Item",
     price:Number(i.unit_price||i.price||0),
     qty:Number(i.quantity||i.qty||1)
   });
 });

 const statusMap={
  new:"New",pending:"New",confirmed:"New",
  preparing:"Preparing",ready:"Ready",served:"Served",
  completed:"Served",cancelled:"Cancelled"
 };

 db.orders=(o.data||[]).map(x=>({
   id:x.order_number ?? x.id,
   cloudId:x.id,
   rid:r.id,
   table:x.table_number ?? tableMap[String(x.table_id)] ?? null,
   tableId:x.table_id ?? null,
   items:itemByOrder[String(x.id)]||[],
   subtotal:Number(x.subtotal||0),
   tax:Number(x.tax_amount ?? x.tax ?? 0),
   total:Number(x.total||0),
   status:statusMap[String(x.status||"new").toLowerCase()]||String(x.status||"New"),
   eta:x.eta_minutes ?? x.eta ?? null,
   started:x.started_at?new Date(x.started_at).getTime():null,
   created:x.created_at?new Date(x.created_at).getTime():Date.now(),
   source:x.source||"QR",
   customerName:x.customer_name||""
 }));

 save();
}

async function loadCloudOrders(r){
 const [o,oi]=await Promise.all([
  sb.from("orders").select("*").eq("restaurant_id",r.id).order("created_at",{ascending:false}),
  sb.from("order_items").select("*")
 ]);
 if(o.error)throw o.error;if(oi.error)throw oi.error;

 const tableMap={};
 const {data:tableRows,error:tableError}=await sb.from("restaurant_tables").select("id,table_number").eq("restaurant_id",r.id);
 if(tableError)throw tableError;
 (tableRows||[]).forEach(tb=>tableMap[String(tb.id)]=tb.table_number);
 const byOrder={};
 (oi.data||[]).forEach(i=>{
   const key=String(i.order_id);
   (byOrder[key] ||= []).push({
     name:i.item_name||i.name||"Item",
     price:Number(i.unit_price||i.price||0),
     qty:Number(i.quantity||i.qty||1)
   });
 });

 const statusMap={new:"New",pending:"New",confirmed:"New",preparing:"Preparing",ready:"Ready",served:"Served",completed:"Served",cancelled:"Cancelled"};
 db.orders=(o.data||[]).map(x=>({
   id:x.order_number ?? x.id,cloudId:x.id,rid:r.id,
   table:x.table_number ?? tableMap[String(x.table_id)] ?? null,tableId:x.table_id ?? null,
   items:byOrder[String(x.id)]||[],
   subtotal:Number(x.subtotal||0),
   tax:Number(x.tax_amount ?? x.tax ?? 0),
   total:Number(x.total||0),
   status:statusMap[String(x.status||"new").toLowerCase()]||String(x.status||"New"),
   eta:x.eta_minutes ?? x.eta ?? null,
   started:x.started_at?new Date(x.started_at).getTime():null,
   created:x.created_at?new Date(x.created_at).getTime():Date.now(),
   source:x.source||"QR",
   customerName:x.customer_name||""
 }));
 save();
}

let cloudOrderTimer=null;
function startOrderSync(){
 clearInterval(cloudOrderTimer);
 cloudOrderTimer=setInterval(async()=>{
   const r=current();
   if(!r || !["dashboard","orders","kitchen"].includes(page))return;
   try{
     await loadCloudOrders(r);
     render();
   }catch(e){console.warn("Order sync:",e)}
 },4000);
}

async function register(){
 const btn=document.querySelector('button[onclick="register()"]');
 if(btn?.disabled)return;
 if(!rn.value||!ro.value||!re.value||!rpass.value)return alert("Fill all required fields.");
 if(rpass.value.length<6)return alert("Password must be at least 6 characters.");
 if(btn){btn.disabled=true;btn.textContent="CREATING ACCOUNT…";}
 try{
  const r=await cloudRegister(rn.value.trim(),ro.value.trim(),re.value.trim(),rp.value.trim(),rpass.value,+nt.value||12);
  db.session=r.id;
  db.restaurants=db.restaurants.filter(x=>x.id!==r.id);
  db.restaurants.push({
    id:r.id,name:r.name,owner:r.owner_name,email:r.email,phone:r.phone,
    tax:r.tax_percent,range:r.ordering_radius_m,lat:r.latitude,lng:r.longitude,
    manual_access:r.manual_access===true,is_active:r.is_active===true,tables:[],menu:[]
  });
  db.ownerEmail=r.email||"";
  save(); await loadCloud(current()); owner();
 }catch(e){
  if(e.message==="EMAIL_CONFIRM_REQUIRED"){
   alert("Account created, but Supabase is waiting for email confirmation.\n\nFor this WEBLYFT setup, open Supabase → Authentication → Sign In / Providers → Confirm email and turn it OFF, then try registration again.");
  }else{
   alert("Registration failed: "+(e.message||"Unknown error"));
  }
  if(btn){btn.disabled=false;btn.textContent="CREATE ACCOUNT";}
 }
}

function addCart(id){let m=current().menu.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({...m,qty:1});render()}
async function sendPOS(){
 if(!cart.length)return alert("Cart is empty.");
 const r=current(), tableNo=+pt.value;
 const table=r.tables.find(t=>t.no===tableNo);
 if(!table?.id)return alert("Selected table is not connected to Supabase.");

 const sub=cart.reduce((a,x)=>a+x.price*x.qty,0);
 const tax=sub*r.tax/100;
 const total=sub+tax;
 const payload={
  restaurant_id:r.id,
  table_id:table.id,
  source:"pos",
  status:"new",
  subtotal:sub,
  tax_amount:tax,
  total:total,
  customer_name:null,
  customer_note:null
 };
 try{
  const {data,error}=await sb.from("orders").insert(payload).select("*").single();
  if(error)throw error;
  const items=cart.map(x=>({
    order_id:data.id,
    menu_item_id:x.id,
    item_name:x.name,
    quantity:x.qty,
    unit_price:x.price,
    line_total:x.price*x.qty
  }));
  const {error:ie}=await sb.from("order_items").insert(items);
  if(ie)throw ie;
  await sb.from("restaurant_tables").update({status:"occupied"}).eq("id",table.id).eq("restaurant_id",r.id);
  cart=[];
  await loadCloudOrders(r);
  startOrderSync();
  go("orders");
 }catch(e){
  alert("Order could not be sent: "+(e.message||e));
 }
}

async function accept(id){
 let x=getOrders().find(o=>String(o.id)===String(id)||String(o.cloudId)===String(id));
 if(!x)return;
 let eta=prompt("Chef preparation time (minutes)","20");
 if(eta===null)return;
 const minutes=Math.max(1,+eta||20);
 try{
   const {error}=await sb.from("orders").update({status:"preparing"}).eq("id",x.cloudId).eq("restaurant_id",current().id);
   if(error)throw error;
   await loadCloudOrders(current());
   const nx=getOrders().find(o=>String(o.cloudId)===String(x.cloudId));
   if(nx){nx.eta=minutes;nx.started=Date.now();save();}
   go("kitchen");
 }catch(e){alert("Order update failed: "+(e.message||e));}
}
async function statusOrder(id,s){
 let x=getOrders().find(o=>String(o.id)===String(id)||String(o.cloudId)===String(id));
 if(!x)return;
 const dbStatus={New:"new",Preparing:"preparing",Ready:"ready",Served:"served"}[s]||String(s).toLowerCase();
 try{
   const {error}=await sb.from("orders").update({status:dbStatus}).eq("id",x.cloudId).eq("restaurant_id",current().id);
   if(error)throw error;
   if(s==="Served" && x.tableId){
     await sb.from("restaurant_tables").update({status:"available"}).eq("id",x.tableId).eq("restaurant_id",current().id);
   }
   await loadCloudOrders(current());
   render();
 }catch(e){alert("Order update failed: "+(e.message||e));}
}

async function addMenu(id){

   if(error)return alert("Could not load item: "+error.message);
   m={
     id:data.id,name:data.name,cat:data.category_name||"Menu",
     desc:data.description||"",price:Number(data.price||0),
     active:data.is_available!==false,image_url:data.image_url||""
   };
 }
 m=m||{name:"",cat:"Starters",desc:"",price:0,active:true,image_url:""};

 open(`<button class="close" onclick="closeModal()">×</button>

async function saveMenuCloud(id){
 const r=current(), btn=$("saveMenuBtn");
 const name=$("mn").value.trim();
 const category=$("mc").value.trim()||"Other";
 const price=Math.max(0,Number($("mp").value)||0);
 const desc=$("md").value.trim();
 const image=$("mi").value.trim()||null;

 if(!name)return alert("Item name required.");

 if(btn){
   btn.disabled=true;
   btn.textContent=id?"UPDATING…":"SAVING…";
 }

 try{
   if(id){
     const {error}=await sb.from("menu_items").update({
       name,
       description:desc,
       image_url:image,
       price,
       is_available:true
     }).eq("id",id).eq("restaurant_id",r.id);
     if(error)throw error;
   }else{
     const {data,error}=await sb.from("menu_items").insert({
       restaurant_id:r.id,
       category_id:null,
       name,
       description:desc,
       image_url:image,
       price,
       is_available:true
     }).select("*").single();
     if(error)throw error;
   }

   closeModal();
   await loadCloud(r);
   await renderMenuCloud();
 }catch(e){
   alert("Menu save failed: "+(e.message||e));
   if(btn){
     btn.disabled=false;
     btn.textContent=id?"UPDATE ITEM":"SAVE ITEM";
   }
 }
}

async function editMenu(id){
 await addMenu(id);
}

async function toggleMenu(id){
 const r=current();
 const item=r.menu.find(x=>String(x.id)===String(id));
 if(!item)return;

 try{
   const {error}=await sb.from("menu_items")
     .update({is_available:!item.active})
     .eq("id",id)
     .eq("restaurant_id",r.id);
   if(error)throw error;

   await loadCloud(r);
   await renderMenuCloud();
 }catch(e){
   alert("Menu status update failed: "+(e.message||e));
 }
}

   <div class="card metric"><small>Stock Items</small><strong>${r.inventory.length}</strong></div>
   <div class="card metric"><small>Low Stock</small><strong>${r.inventory.filter(x=>x.qty<=x.min).length}</strong></div>
   <div class="card metric"><small>Total Units</small><strong>${r.inventory.reduce((a,x)=>a+(+x.qty||0),0)}</strong></div>
   <div class="card metric"><small>Stock Value</small><strong>${money(r.inventory.reduce((a,x)=>a+(+x.qty||0)*(+x.cost||0),0))}</strong></div>
 </div>
 <div class=card style="margin-top:10px">
   <div style="overflow:auto">
    <table class=table>
      <tr><th>ITEM</th><th>CATEGORY</th><th>QTY</th><th>MIN</th><th>COST</th><th>STATUS</th><th>ACTION</th></tr>
      ${r.inventory.map(x=>`
        <tr>
          <td><b>${esc(x.name)}</b></td>
          <td>${esc(x.cat||"General")}</td>
          <td>${x.qty} ${esc(x.unit||"pcs")}</td>
          <td>${x.min}</td>
          <td>${money(x.cost)}</td>
          <td><span class="status ${x.qty<=x.min?'prep':'ready'}">${x.qty<=x.min?'LOW':'OK'}</span></td>
          <td>
            <button class="btn soft" onclick="inventoryAdjust('${x.id}',1)">+1</button>
            <button class="btn soft" onclick="inventoryAdjust('${x.id}',-1)">−1</button>
            <button class="btn outline" onclick="inventoryEdit('${x.id}')">Edit</button>
          </td>
        </tr>`).join("") || `<tr><td colspan=7 class=mut>No stock items yet.</td></tr>`}
    </table>
   </div>
 </div>`;
}

function inventoryAdd(){
 open(`<button class="close" onclick="closeModal()">×</button>
   <h2>Add Stock Item</h2>
   <input class=field id=inm placeholder="Item name">
   <input class=field id=inc placeholder="Category (e.g. Dairy)">
   <input class=field id=inq type=number min=0 step=0.01 value="0" placeholder="Current quantity">
   <input class=field id=inmin type=number min=0 step=0.01 value="5" placeholder="Low-stock minimum">
   <input class=field id=incost type=number min=0 step=0.01 value="0" placeholder="Cost per unit">
   <input class=field id=inunit value="pcs" placeholder="Unit (pcs, kg, litre...)">
   <button class="btn primary" style="width:100%" onclick="inventorySave()">SAVE STOCK ITEM</button>`);
}

function inventorySave(){
 const r=current();
 const name=$("inm").value.trim();
 if(!name)return alert("Stock item name required.");
 const item={
   id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),
   name,
   cat:$("inc").value.trim()||"General",
   qty:Math.max(0,Number($("inq").value)||0),
   min:Math.max(0,Number($("inmin").value)||0),
   cost:Math.max(0,Number($("incost").value)||0),
   unit:$("inunit").value.trim()||"pcs",
   updated:Date.now()
 };
 r.inventory=r.inventory||[];
 r.inventory.push(item);
 save();
 closeModal();
 render();
}

function inventoryEdit(id){
 const r=current(),x=(r.inventory||[]).find(i=>String(i.id)===String(id));
 if(!x)return;
 open(`<button class="close" onclick="closeModal()">×</button>
   <h2>Edit Stock Item</h2>
   <input class=field id=inm value="${esc(x.name)}" placeholder="Item name">
   <input class=field id=inc value="${esc(x.cat||"General")}" placeholder="Category">
   <input class=field id=inq type=number min=0 step=0.01 value="${x.qty}" placeholder="Current quantity">
   <input class=field id=inmin type=number min=0 step=0.01 value="${x.min}" placeholder="Low-stock minimum">
   <input class=field id=incost type=number min=0 step=0.01 value="${x.cost}" placeholder="Cost per unit">
   <input class=field id=inunit value="${esc(x.unit||"pcs")}" placeholder="Unit">
   <button class="btn primary" style="width:100%" onclick="inventoryUpdate('${x.id}')">UPDATE STOCK ITEM</button>`);
}

function inventoryUpdate(id){
 const r=current(),x=(r.inventory||[]).find(i=>String(i.id)===String(id));
 if(!x)return;
 const name=$("inm").value.trim();
 if(!name)return alert("Stock item name required.");
 x.name=name;
 x.cat=$("inc").value.trim()||"General";
 x.qty=Math.max(0,Number($("inq").value)||0);
 x.min=Math.max(0,Number($("inmin").value)||0);
 x.cost=Math.max(0,Number($("incost").value)||0);
 x.unit=$("inunit").value.trim()||"pcs";
 x.updated=Date.now();
 save();
 closeModal();
 render();
}

function inventoryAdjust(id,delta){
 const r=current(),x=(r.inventory||[]).find(i=>String(i.id)===String(id));
 if(!x)return;
 x.qty=Math.max(0,(+x.qty||0)+delta);
 x.updated=Date.now();
 save();
 render();
}
function reports(){ if(!accessAllowed(current())){ return accessLockedPage(); }let o=getOrders(),sales=o.reduce((a,x)=>a+x.total,0),tax=o.reduce((a,x)=>a+x.tax,0);return `<div class=head><div><h1>Reports</h1><small class=mut>Restaurant performance</small></div></div><div class=cards><div class="card metric"><small>Total Sales</small><strong>${money(sales)}</strong></div><div class="card metric"><small>Total Orders</small><strong>${o.length}</strong></div><div class="card metric"><small>Tax Collected</small><strong>${money(tax)}</strong></div><div class="card metric"><small>Average Order</small><strong>${money(o.length?sales/o.length:0)}</strong></div><div class="card metric"><small>Tables</small><strong>${current().tables.length}</strong></div></div>`}
function customers(){ if(!accessAllowed(current())){ return accessLockedPage(); }let o=getOrders(),names=[...new Set(o.map(x=>x.name).filter(Boolean))];return `<div class=head><div><h1>Customers</h1><small class=mut>Customer activity</small></div></div><div class=card>${names.length?names.map(n=>`<div class=line><b>${esc(n)}</b><span>Customer</span></div>`).join(""):"<p class=mut>No named customers yet. Customer names are optional at QR checkout.</p>"}</div>`}
function settings(){let r=current();return `<div class=head><div><h1>Settings</h1><small class=mut>Tax + geofence</small></div></div><div class=card><input class=field id=sn value="${esc(r.name)}" placeholder="Restaurant name"><input class=field id=st type=number value="${r.tax}" placeholder="Tax %"><input class=field id=sr type=number value="${r.range}" placeholder="Ordering range in meters"><input class=field id=slat type=number step=any value="${r.lat??""}" placeholder="Restaurant latitude"><input class=field id=slng type=number step=any value="${r.lng??""}" placeholder="Restaurant longitude"><button class="btn soft" onclick=getLocation()>USE CURRENT LOCATION</button> <button class="btn primary" onclick=saveSettings()>SAVE SETTINGS</button><p class=mut>Customer orders can be blocked outside the configured radius.</p></div>`}
function getLocation(){if(!navigator.geolocation)return alert("Geolocation unavailable.");navigator.geolocation.getCurrentPosition(p=>{slat.value=p.coords.latitude;slng.value=p.coords.longitude},()=>alert("Allow location permission."))}
function saveSettings(){let r=current();r.name=sn.value;r.tax=Math.max(0,+st.value||0);r.range=Math.max(1,+sr.value||100);r.lat=slat.value?+slat.value:null;r.lng=slng.value?+slng.value:null;save();owner();alert("Settings saved.")}

async function admin(){
 if(!(await isAdminAccountAsync()))return `<div class=card><div class=notice>Admin access denied. Please login with ${ADMIN_EMAIL}.</div></div>`;
 return `<div class=head>
   <div><h1>Admin Control</h1><small class=mut>Manage WEBLYFT restaurant accounts</small></div>
   <button class="btn primary" onclick="loadAdmin()">REFRESH</button>
 </div>
 <div class=card>
   <div class=notice><b>Master Admin:</b> ${ADMIN_EMAIL}<br>
   Use this panel to activate or deactivate restaurant accounts. Deactivated accounts cannot use the owner system or accept QR orders.</div>
   <div id=adminList><p class=mut>Loading accounts…</p></div>
 </div>`;
}

async function loadAdmin(){
 if(!(await isAdminAccountAsync())){alert(`Admin access only: ${ADMIN_EMAIL}`);return;}
 const box=$("adminList");
 if(!box)return;
 try{
   const {data,error}=await sb.rpc("admin_list_restaurants");
   if(error)throw error;
   const rows=data||[];
   box.innerHTML=rows.map(x=>`<div class=line style="align-items:center">
     <span>
       <b>${esc(x.name||"Unnamed Restaurant")}</b>
       <small style="display:block;color:#718096">
         ${esc(x.owner_name||"")} • ${esc(x.email||"")} • ID ${esc(x.restaurant_code||x.id)}
       </small>
       <small style="display:block;margin-top:3px">
         Access: <b>${x.is_active?'ACTIVE':'INACTIVE'}</b>
       </small>
     </span>
     <span>
       <span class="status ${x.is_active?'ready':'served'}">${x.is_active?'ACTIVE':'DEACTIVE'}</span>
       <button class="btn ${x.is_active?'danger':'success'}" onclick="adminToggle('${x.id}',${!x.is_active})">
         ${x.is_active?'DEACTIVATE':'ACTIVATE'}
       </button>
     </span>
   </div>`).join("") || `<p class=mut>No restaurant accounts found.</p>`;
 }catch(e){
   box.innerHTML=`<div class=notice>Admin data could not load: ${esc(e.message||e)}</div>`;
 }
}

async function adminToggle(id,nextActive){
 if(!(await isAdminAccountAsync())){alert(`Admin access only: ${ADMIN_EMAIL}`);return;}
 const action=nextActive?"activate":"deactivate";
 if(!confirm(`Are you sure you want to ${action} this restaurant account?`))return;
 try{
   const {data,error}=await sb.rpc("admin_set_restaurant_active",{p_restaurant_id:id,p_active:nextActive});
   if(error)throw error;
   await loadAdmin();
   alert(`Restaurant ${nextActive?"activated":"deactivated"} successfully.`);
 }catch(e){
   alert("Admin action failed: "+(e.message||e));
 }
}

function accessLockedPage(){ return `<div class=head><div><h1>Account Inactive</h1><small class=mut>Waiting for WEBLYFT Admin activation</small></div></div><div class=card style="max-width:720px"><h2>Access is currently locked</h2><p>Your restaurant account must be activated by WEBLYFT Admin before POS, Orders, Kitchen/KOT, Menu, Tables & QR, Inventory, Reports and Customers become available.</p><div class=notice><b>No subscription is required.</b><br>WEBLYFT access is controlled only by Admin activation.</div></div>`;}

async function customer(){
let p=new URLSearchParams(location.search);
let rid=p.get("rid"),tableNo=Number(p.get("table")),token=p.get("token");
if(!rid||!tableNo||!token){
 $("app").innerHTML=`<div class=wrap><div class=hero><h1>Invalid QR</h1><p>This QR link is missing restaurant or table information.</p></div></div>`;
 return;
}
$("app").innerHTML=`<div class=wrap><div class=card style="text-align:center"><h2>Loading menu…</h2><p class=mut>Connecting to WEBLYFT</p></div></div>`;
try{
 let data,error;
 if(/^WL-/i.test(rid)){
   ({data,error}=await sb.rpc("get_public_qr_menu_by_code",{
     p_restaurant_code:rid,p_table_number:tableNo,p_qr_token:token
   }));
 }else{
   ({data,error}=await sb.rpc("get_public_qr_menu",{
     p_restaurant_id:rid,p_table_number:tableNo,p_qr_token:token
   }));
 }
 if(error)throw error;
 if(!data||!data.restaurant||!data.table)throw new Error("Invalid QR");
  if(data.access_active===false)throw new Error("restaurant_inactive");
 let r={
   id:data.restaurant.id,name:data.restaurant.name,tax:Number(data.restaurant.tax_percent||0),
   range:Number(data.restaurant.ordering_radius_m||100),
   lat:data.restaurant.latitude,lng:data.restaurant.longitude
 };
 let t={no:Number(data.table.table_number),id:data.table.id,token:data.table.qr_token,status:data.table.status};
 r.menu=(data.menu||[]).map(m=>({
   id:m.id,name:m.name,cat:m.category||"Other",desc:m.description||"",
   price:Number(m.price||0),active:!!m.is_available
 }));
 let cc=[],cat="All",qq="",placed=null;

 function renderC(){
  let cats=["All",...new Set(r.menu.map(x=>x.cat))];
  let items=r.menu.filter(x=>x.active&&(cat==="All"||x.cat===cat)&&x.name.toLowerCase().includes(qq.toLowerCase()));
  let sub=cc.reduce((a,x)=>a+x.price*x.qty,0);
  $("app").innerHTML=`<div class=customer><header class=chead><b>${esc(r.name)}</b><small style="display:block;opacity:.75">TABLE ${t.no} • CUSTOMER MENU</small></header><main class=wrap>
  <div class=hero><small>WELCOME</small><h1>Order from your table</h1><p style="margin:0">Your QR is connected to Table ${t.no}.</p></div>
  <input class=search value="${esc(qq)}" placeholder="Search dishes..." oninput="window.__qrSearch(this.value)">
  <div class=tabs>${cats.map(c=>`<button class="${cat===c?'on':''}" onclick="window.__qrCat(${JSON.stringify(c)})">${esc(c)}</button>`).join("")}</div>
  ${items.map(m=>`<div class=citem><div><b>${esc(m.name)}</b><small style="display:block;color:#718096">${esc(m.cat)} • ${esc(m.desc)}</small><strong>${money(m.price)}</strong></div><button class="btn primary" onclick="window.__qrAdd('${m.id}')">ADD</button></div>`).join("")||"<p class=mut>No dishes found.</p>"}</main>
  ${cc.length?`<div class=cartbar><b>${cc.reduce((a,x)=>a+x.qty,0)} items • ${money(sub)}</b><button class=btn style="float:right;background:#fff;color:#0755ca" onclick=window.__qrCheckout()>VIEW CART</button></div>`:""}</div>`;
 }

 window.__qrSearch=v=>{qq=v;renderC()};
 window.__qrCat=v=>{cat=v;renderC()};
 window.__qrAdd=id=>{let m=r.menu.find(x=>String(x.id)===String(id)),x=cc.find(x=>x.id===id);x?x.qty++:cc.push({...m,qty:1});renderC()};

 window.__qrCheckout=()=>{
  let sub=cc.reduce((a,x)=>a+x.price*x.qty,0),tax=sub*r.tax/100;
  open(`<button class=close onclick=closeModal()>×</button><h2>Cart • Table ${t.no}</h2>
  ${cc.map(x=>`<div class=line><span>${esc(x.name)} × ${x.qty}</span><b>${money(x.price*x.qty)}</b></div>`).join("")}
  <div class=line><span>Subtotal</span><b>${money(sub)}</b></div>
  <div class=line><span>Tax (${r.tax}%)</span><b>${money(tax)}</b></div>
  <div class=line><b>Total</b><b>${money(sub+tax)}</b></div>
  <input id=customerName class=field placeholder="Name (optional)">
  <textarea id=customerNote class=field placeholder="Special note"></textarea>
  <button class="btn primary" style="width:100%" onclick=window.__qrPlace()>PLACE ORDER</button>`);
 };

 window.__qrPlace=()=>{
  if(r.lat!==null&&r.lat!==undefined&&navigator.geolocation){
   navigator.geolocation.getCurrentPosition(
    pos=>finishC(pos.coords.latitude,pos.coords.longitude),
    ()=>alert("Location permission is required for ordering from this table.")
   );
  }else finishC(null,null);
 };

 async function finishC(lat,lng){
  if(r.lat!==null&&r.lat!==undefined&&r.lng!==null&&r.lng!==undefined){
   if(lat===null||lng===null)return alert("Location permission is required.");
   let d=distance(r.lat,r.lng,lat,lng);
   if(d>r.range)return alert("You are outside the restaurant's "+r.range+"m ordering range.");
  }
  let sub=cc.reduce((a,x)=>a+x.price*x.qty,0),tax=sub*r.tax/100;
  if(!cc.length)return alert("Your cart is empty.");
  try{
   const {data,error}=await sb.rpc("place_public_order",{
    p_restaurant_id:r.id,
    p_table_id:t.id,
    p_customer_name:$("customerName").value||null,
    p_customer_note:$("customerNote").value||null,
    p_subtotal:sub,
    p_tax_amount:tax,
    p_total:sub+tax,
    p_items:cc.map(x=>({menu_item_id:x.id,item_name:x.name,quantity:x.qty,unit_price:x.price,line_total:x.price*x.qty}))
   });
   if(error)throw error;
   close();
   placed={id:data.order_id,table:t.no,status:"New",eta:null,total:sub+tax};
   trackC();
  }catch(e){alert("Order could not be placed: "+e.message);}
 }

 function trackC(){
  $("app").innerHTML=`<div class=customer><header class=chead><b>${esc(r.name)}</b><small style="display:block">TABLE ${t.no} • ORDER #${esc(placed.id)}</small></header><main class=wrap><div class=card>
  <div class=timeline>${["New","Preparing","Ready","Served"].map((x,i)=>`<div class="node ${i===0?'on':''}" id="node-${i}"><div style="width:20px;height:20px;border-radius:50%;margin:auto;background:${i===0?'#19a66a':'#e3e9ef'}"></div>${x}</div>`).join("")}</div>
  <h2 style="text-align:center">Order received</h2><p class=mut style="text-align:center">Order #${esc(placed.id)} has been sent to the restaurant.</p>
  </div></main></div>`;
 }

 renderC();
}catch(e){
 $("app").innerHTML=`<div class=wrap><div class=hero><h1>Invalid QR</h1><p>This QR is not connected to a valid restaurant table.</p><small>${esc(e.message||"QR validation failed")}</small></div></div>`;
 console.error(e);
}
}

const __params=new URLSearchParams(location.search);
const __customerMode=__params.get("customer")==="1";
if(__customerMode){
  // QR/customer mode NEVER boots the owner account, even if this browser
  // has a previous Supabase/local owner session.
  customer().catch(e=>console.error(e));
}else if(db.session&&current()){
  owner();
}else{
  auth();
}
</script>
</body>
