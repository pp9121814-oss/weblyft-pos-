<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEBLYFT Restaurant OS</title>
<style>
:root{--b:#1769d1;--c:#16a6d8;--ink:#172536;--mut:#718096;--bg:#f4f7fa;--line:#dbe3ec;--w:#fff;--g:#198754;--a:#d58a00;--r:#c64242}
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.hide{display:none!important}
header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;object-fit:contain}.brand b{font-size:21px;color:var(--b)}.brand small{display:block;color:var(--mut);font-size:9px;letter-spacing:1px}
.headBtns{display:flex;gap:7px;align-items:center}.btn{padding:10px 13px;border-radius:9px;font-weight:800}.primary{background:var(--b);color:#fff}.secondary{background:#eaf4ff;color:#125398}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#ffebeb;color:#9b2b2b}
.layout{display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid var(--line);padding:10px;position:sticky;top:64px;height:calc(100vh - 64px)}
aside button{width:100%;text-align:left;background:transparent;padding:11px;border-radius:9px;color:#4c5b6e;font-weight:700;margin:2px 0}aside button.active,aside button:hover{background:#eaf4ff;color:var(--b)}
main{padding:20px;max-width:1400px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:16px}.eyebrow{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}h1,h2,h3{margin:0 0 8px}.sub{color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:13px}.stat{padding:14px}.stat small{color:var(--mut)}.stat strong{display:block;font-size:24px;margin-top:4px}.card{padding:15px;margin-top:12px}.two{display:grid;grid-template-columns:1.35fr .9fr;gap:12px}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.quick button{background:#fafbfd;border:1px solid var(--line);padding:14px;border-radius:10px;text-align:left}.quick b{display:block;font-size:20px;margin-bottom:4px}
.order{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.badge{padding:5px 8px;border-radius:18px;font-size:10px;font-weight:800}.new{background:#ffeaea;color:#9d2d2d}.prep{background:#fff1d1;color:#815700}.ready{background:#e6f2ff;color:#1758a0}.done{background:#e7f7ed;color:#1f7c4d}
.pos{display:grid;grid-template-columns:1.55fr .9fr;gap:12px}.toolbar{display:flex;gap:8px}.toolbar input,.toolbar select,input,select{width:100%;padding:11px;border:1px solid #cbd6e1;border-radius:9px;background:#fff;outline:none}.toolbar select{max-width:160px}.cats{display:flex;gap:7px;overflow:auto;padding:9px 0}.cats button{white-space:nowrap;background:#edf1f6;color:#556377;padding:8px 12px;border-radius:18px;font-weight:700}.cats button.active{background:var(--b);color:#fff}.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.food{background:#fff;border:1px solid var(--line);border-radius:10px;text-align:left;padding:13px}.food b{display:block}.food small{display:block;color:var(--mut);margin:4px 0}
.cartline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.qty{display:flex;gap:5px;margin-top:5px}.qty button{width:26px;height:26px;background:#edf1f6;border-radius:7px}.totals{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:10px}.totals strong{border-top:1px solid var(--line);padding-top:8px}
.tablegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.tbl{background:#fff;border:2px solid var(--line);border-radius:11px;padding:17px 7px}.tbl strong{display:block;font-size:20px}.tbl small{display:block;color:var(--mut)}.free{border-color:#b6ddc7}.occupied{border-color:#efbe78;background:#fffaf0}.reserved{border-color:#aabbea;background:#f3f6ff}
.qrgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.qrbox{text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.qrbox img{max-width:230px;width:100%;margin:auto;display:block}.url{word-break:break-all;font-size:11px;color:var(--mut);background:#f4f7fa;padding:9px;border-radius:8px;margin:10px 0}
.table{width:100%;border-collapse:collapse}.table td,.table th{padding:11px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:10px;color:var(--mut);text-transform:uppercase}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}
.auth{min-height:100vh;display:grid;place-items:center;background:#f4f8fc;padding:18px}.authbox{background:#fff;border:1px solid var(--line);border-radius:18px;width:min(460px,100%);padding:26px}.authbox img{display:block;width:88px;height:88px;object-fit:contain;margin:0 auto 8px}.authbox h1,.authbox h2{text-align:center;color:var(--b)}.authbox p{text-align:center;color:var(--mut)}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.choice button{padding:18px;background:#eaf4ff;color:#14589e;border-radius:11px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:100}.modalbox{width:min(470px,100%);background:#fff;border-radius:15px;padding:20px}
.mobile{display:none}
@media(max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}.two,.pos,.qrgrid{grid-template-columns:1fr}.foods{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.layout{grid-template-columns:1fr}aside{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px;z-index:40}.mobile button{background:none;color:var(--mut);font-size:10px;font-weight:700}.mobile button.active{color:var(--b)}main{padding:16px 13px 75px}.tablegrid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.foods{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.choice{grid-template-columns:1fr}}
</style>
</head>
<body><div id="root"></div><div id="modal"></div>

<script>
const LOGO='weblyft_logo.png';
const db=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let account=db('w_owner');
let restaurant=db('w_rest')||{id:'WL-482731',name:'Demo Restaurant',tax:5,range:100,subscription:null};
let tables=db('w_tables')||[];
let menu=db('w_menu')||[
 {id:1,n:'Paneer Tikka',p:180,c:'Starters',active:true},
 {id:2,n:'Veg Burger',p:140,c:'Burgers',active:true},
 {id:3,n:'French Fries',p:110,c:'Sides',active:true},
 {id:4,n:'Masala Maggi',p:90,c:'Quick Bites',active:true},
 {id:5,n:'Cold Coffee',p:120,c:'Drinks',active:true},
 {id:6,n:'Fresh Lime',p:80,c:'Drinks',active:true},
 {id:7,n:'Margherita Pizza',p:220,c:'Pizza',active:true},
 {id:8,n:'Chocolate Shake',p:150,c:'Shakes',active:true}
];
let orders=db('w_orders')||[],bills=db('w_bills')||[],stock=db('w_stock')||[
 {n:'Paneer',q:4.2,u:'kg',min:2},{n:'Coffee',q:1.1,u:'kg',min:2},{n:'Buns',q:12,u:'pcs',min:10},{n:'Cheese',q:8,u:'pcs',min:5}
],customers=db('w_customers')||[],expenses=db('w_expenses')||[];
if(!tables.length){tables=Array.from({length:12},(_,i)=>({n:i+1,status:'free',token:token()}));persist()}

let logged=localStorage.getItem('w_logged')==='1',page='dashboard',cart=[],search='',category='All',selectedTable=1;
const money=n=>'₹'+Number(n||0).toFixed(0);
function token(){return (crypto.randomUUID?crypto.randomUUID():'T'+Date.now()+Math.random().toString(36).slice(2))}
function persist(){put('w_owner',account);put('w_rest',restaurant);put('w_tables',tables);put('w_menu',menu);put('w_orders',orders);put('w_bills',bills);put('w_stock',stock);put('w_customers',customers);put('w_expenses',expenses)}
function nav(){return [['dashboard','⌂','Home'],['pos','▣','POS'],['orders','◉','Orders'],['kitchen','♨','Kitchen'],['tables','▦','Tables'],['menu','☷','Menu'],['qr','▣','QR Codes'],['inventory','□','Inventory'],['customers','♙','Customers'],['reports','◔','Reports'],['settings','⚙','Settings']]}
function login(){document.getElementById('root').innerHTML=`<div class="auth"><div class="authbox"><img src="${LOGO}"><h1>WEBLYFT</h1><p>Restaurant OS</p><input id="li" placeholder="Restaurant ID / Email"><input id="lp" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:8px" onclick="doLogin()">LOGIN</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="registerScreen()">CREATE RESTAURANT ACCOUNT</button><p>For testing: any login values work after an account exists.</p></div></div>`}
function registerScreen(){document.getElementById('root').innerHTML=`<div class="auth"><div class="authbox"><img src="${LOGO}"><h2>Create Restaurant Account</h2><p>Registration comes before subscription.</p><input id="rn" placeholder="Restaurant name"><input id="ro" placeholder="Owner name"><input id="re" placeholder="Email"><input id="rp" placeholder="Phone"><input id="rt" type="number" value="12" placeholder="Tables"><button class="btn primary" style="width:100%;margin-top:8px" onclick="register()">REGISTER</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="login()">Back</button></div></div>`}
function register(){if(!rn.value||!ro.value||!re.value)return alert('Fill required fields');account={id:'WL-'+Math.floor(100000+Math.random()*899999),name:rn.value,owner:ro.value,email:re.value,phone:rp.value};restaurant={id:account.id,name:account.name,tax:5,range:100,subscription:null};tables=Array.from({length:Math.max(1,+rt.value||12)},(_,i)=>({n:i+1,status:'free',token:token()}));persist();logged=true;localStorage.setItem('w_logged','1');page='dashboard';render();setTimeout(subscription,400)}
function doLogin(){if(!account)return alert('Create a restaurant account first.');logged=true;localStorage.setItem('w_logged','1');render()}
function logout(){logged=false;localStorage.setItem('w_logged','0');login()}
function subscription(){if(restaurant.subscription?.active)return;openModal(`<h2>WEBLYFT Subscription</h2><p class="sub">Your restaurant account is created. Start your 7-day trial, then continue at <b>₹3,499/year</b>.</p><div class="card"><h3>₹3,499 / Year</h3><p class="sub">One plan • full Restaurant OS</p></div><button class="btn primary" style="width:100%" onclick="trial()">START 7-DAY TRIAL</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">LATER</button>`)}
function trial(){restaurant.subscription={active:true,trial:true,started:Date.now(),expiry:Date.now()+7*864e5};persist();closeModal();render()}
function activate(){restaurant.subscription={active:true,trial:false,started:Date.now(),expiry:Date.now()+365*864e5};persist();closeModal();render()}
function shell(){return `<header><div class="brand"><img src="${LOGO}"><div><b>WEBLYFT</b><small>RESTAURANT OS</small></div></div><div class="headBtns"><span class="pill">${account?.id||''}</span><button class="btn ghost" onclick="subscription()">Subscription</button><button class="btn ghost" onclick="logout()">Logout</button></div></header><div class="layout"><aside>${nav().map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}</aside><main id="content"></main></div><nav class="mobile">${nav().slice(0,6).map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}</nav>`}
function go(p){page=p;render()}
const views={
dashboard:()=>{let sales=bills.reduce((a,b)=>a+b.total,0),pending=orders.filter(o=>o.status!=='Completed').length,occ=tables.filter(t=>t.status==='occupied').length,low=stock.filter(s=>s.q<=s.min).length;return `<div class="head"><div><div class="eyebrow">Restaurant dashboard</div><h1>${restaurant.name}</h1><p class="sub">Today's operations</p></div><button class="btn primary" onclick="go('pos')">+ New Bill</button></div><div class="cards"><div class="stat"><small>Today's Sales</small><strong>${money(sales)}</strong></div><div class="stat"><small>Orders</small><strong>${orders.length}</strong></div><div class="stat"><small>Tables</small><strong>${occ}/${tables.length}</strong></div><div class="stat"><small>Low Stock</small><strong>${low}</strong></div></div><div class="two"><section class="card"><div class="head"><h2>Live Orders</h2><button class="btn ghost" onclick="go('orders')">View all</button></div>${orders.slice().reverse().slice(0,5).map(orderRow).join('')||'<p class="sub">No orders yet.</p>'}</section><section class="card"><h2>Quick Access</h2><div class="quick">${[['pos','🧾','New Bill'],['kitchen','👨‍🍳','Kitchen'],['tables','🪑','Tables'],['qr','🔳','QR Codes'],['menu','🍽️','Menu'],['reports','📊','Reports']].map(x=>`<button onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</div></section></div>`},
pos:()=>{let cats=['All',...new Set(menu.map(m=>m.c))],list=menu.filter(m=>m.active&&(!search||m.n.toLowerCase().includes(search.toLowerCase()))&&(category==='All'||m.c===category)),sub=cart.reduce((a,x)=>a+x.p*x.q,0),tax=sub*restaurant.tax/100;return `<div class="head"><div><div class="eyebrow">Point of sale</div><h1>New Order</h1></div><select style="max-width:160px" onchange="selectedTable=+this.value;render()">${tables.map(t=>`<option value="${t.n}" ${t.n===selectedTable?'selected':''}>Table ${t.n}</option>`).join('')}</select></div><div class="pos"><section class="card"><div class="toolbar"><input placeholder="Search menu..." value="${search}" oninput="search=this.value;render()"></div><div class="cats">${cats.map(c=>`<button class="${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div><div class="foods">${list.map(m=>`<button class="food" onclick="addCart(${m.id})"><b>${m.n}</b><small>${m.c}</small><strong>${money(m.p)}</strong></button>`).join('')}</div></section><section class="card"><h2>Table ${selectedTable}</h2>${cart.map(x=>`<div class="cartline"><div><b>${x.n}</b><div class="qty"><button onclick="chg(${x.id},-1)">−</button><b>${x.q}</b><button onclick="chg(${x.id},1)">+</button></div></div><strong>${money(x.p*x.q)}</strong></div>`).join('')||'<p class="sub">Cart is empty.</p>'}<div class="totals"><span>Subtotal</span><b>${money(sub)}</b><span>Tax ${restaurant.tax}%</span><b>${money(tax)}</b><strong>Total</strong><strong>${money(sub+tax)}</strong></div><button class="btn primary" style="width:100%" onclick="sendKOT()">SEND TO KITCHEN</button></section></div>`},
orders:()=>`<div class="head"><div><div class="eyebrow">Order center</div><h1>Live Orders</h1></div></div><section class="card">${orders.slice().reverse().map(o=>`${orderRow(o)}<div class="actions">${o.status==='New'?`<button class="btn primary" onclick="accept(${o.id})">ACCEPT</button>`:''}${o.status==='Preparing'?`<button class="btn secondary" onclick="ready(${o.id})">MARK READY</button>`:''}${o.status==='Ready'?`<button class="btn primary" onclick="complete(${o.id})">COMPLETE</button>`:''}${o.status==='Completed'?`<button class="btn ghost" onclick="bill(${o.id})">CREATE BILL</button>`:''}</div>`).join('')||'<p class="sub">No orders.</p>'}</section>`,
kitchen:()=>`<div class="head"><div><div class="eyebrow">Kitchen</div><h1>KOT / Kitchen Display</h1><p class="sub">Chef accepts orders and sets preparation time.</p></div></div><div class="cards" style="grid-template-columns:repeat(3,1fr)">${orders.filter(o=>o.status!=='Completed').slice().reverse().map(o=>`<section class="card"><div class="head"><div><h2>#${o.id}</h2><small>Table ${o.table}</small></div><span class="badge ${o.status==='New'?'new':o.status==='Preparing'?'prep':'ready'}">${o.status}</span></div>${o.items.map(i=>`<div class="listrow">${i.n} × ${i.q}</div>`).join('')}<p><b>${money(o.total)}</b></p>${o.status==='New'?`<button class="btn primary" style="width:100%" onclick="accept(${o.id})">ACCEPT & SET TIME</button>`:o.status==='Preparing'?`<p class="sub">ETA: ${o.eta} min</p><button class="btn secondary" style="width:100%" onclick="ready(${o.id})">ORDER READY</button>`:`<button class="btn primary" style="width:100%" onclick="complete(${o.id})">SERVED</button>`}</section>`).join('')||'<section class="card"><p class="sub">Kitchen is clear.</p></section>'}</div>`,
tables:()=>`<div class="head"><div><div class="eyebrow">Table management</div><h1>Tables</h1><p class="sub">Each table has its own secure token for QR ordering.</p></div><button class="btn primary" onclick="addTable()">+ Add Table</button></div><div class="tablegrid">${tables.map(t=>`<button class="tbl ${t.status}" onclick="toggleTable(${t.n})"><strong>${String(t.n).padStart(2,'0')}</strong><small>TABLE</small><div>${t.status}</div></button>`).join('')}</div>`,
menu:()=>`<div class="head"><div><div class="eyebrow">Menu</div><h1>Menu Manager</h1></div><button class="btn primary" onclick="menuModal()">+ Add Item</button></div><section class="card"><table class="table"><tr><th>Item</th><th>Category</th><th>Price</th><th>Status</th><th></th></tr>${menu.map((m,i)=>`<tr><td><b>${m.n}</b></td><td>${m.c}</td><td>${money(m.p)}</td><td><span class="badge ${m.active?'done':'new'}">${m.active?'LIVE':'OFF'}</span></td><td><button class="btn ghost" onclick="menu[${i}].active=!menu[${i}].active;persist();render()">Toggle</button></td></tr>`).join('')}</table></section>`,
qr:()=>{let t=tables.find(x=>x.n===selectedTable)||tables[0],url=`https://your-domain.com/customer.html?restaurant=${encodeURIComponent(restaurant.id)}&table=${t.n}&token=${encodeURIComponent(t.token)}`;return `<div class="head"><div><div class="eyebrow">Contactless ordering</div><h1>QR Manager</h1><p class="sub">Unique QR per restaurant table.</p></div></div><div class="qrgrid"><section class="card"><h2>Table ${t.n}</h2><select onchange="selectedTable=+this.value;render()">${tables.map(x=>`<option value="${x.n}" ${x.n===t.n?'selected':''}>Table ${x.n}</option>`).join('')}</select><div class="url">${url}</div><button class="btn secondary" onclick="navigator.clipboard?.writeText('${url}');alert('Link copied')">COPY LINK</button><p class="sub">Publish your customer website at the URL base above to make scans open the live menu.</p></section><div class="qrbox"><img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(url)}"><h3>TABLE ${t.n}</h3></div></div>`},
inventory:()=>`<div class="head"><div><div class="eyebrow">Stock</div><h1>Inventory</h1></div><button class="btn primary" onclick="stockModal()">+ Add Item</button></div><section class="card"><table class="table"><tr><th>Ingredient</th><th>Stock</th><th>Minimum</th><th>Status</th></tr>${stock.map(s=>`<tr><td>${s.n}</td><td>${s.q} ${s.u}</td><td>${s.min}</td><td><span class="badge ${s.q<=s.min?'new':'done'}">${s.q<=s.min?'LOW':'OK'}</span></td></tr>`).join('')}</table></section>`,
customers:()=>`<div class="head"><div><div class="eyebrow">CRM</div><h1>Customers</h1></div><button class="btn primary" onclick="custModal()">+ Add Customer</button></div><section class="card">${customers.map(c=>`<div class="order"><div><b>${c.n}</b><div class="sub">${c.p||''}</div></div><b>${money(c.s||0)}</b></div>`).join('')||'<p class="sub">No customers yet.</p>'}</section>`,
reports:()=>{let s=bills.reduce((a,b)=>a+b.total,0),e=expenses.reduce((a,b)=>a+b.a,0);return `<div class="head"><div><div class="eyebrow">Reports</div><h1>Sales & Reports</h1></div></div><div class="cards"><div class="stat"><small>Sales</small><strong>${money(s)}</strong></div><div class="stat"><small>Expenses</small><strong>${money(e)}</strong></div><div class="stat"><small>Net</small><strong>${money(s-e)}</strong></div><div class="stat"><small>Bills</small><strong>${bills.length}</strong></div></div><section class="card"><h2>Payments</h2>${['Cash','UPI','Card'].map(p=>`<div class="order"><span>${p}</span><b>${money(bills.filter(b=>b.payment===p).reduce((a,b)=>a+b.total,0))}</b></div>`).join('')}</section>`},
settings:()=>`<div class="head"><div><div class="eyebrow">Settings</div><h1>Restaurant Settings</h1></div></div><section class="card"><div class="formgrid"><div><label>Restaurant name</label><input id="sname" value="${restaurant.name}"></div><div><label>Tax %</label><input id="stax" type="number" value="${restaurant.tax}"></div><div><label>Order range (meters)</label><input id="srange" type="number" value="${restaurant.range}"></div><div><label>Restaurant ID</label><input value="${restaurant.id}" disabled></div><div class="wide"><button class="btn primary" onclick="restaurant.name=sname.value;restaurant.tax=+stax.value||0;restaurant.range=+srange.value||100;persist();render()">SAVE</button></div></div></section><section class="card"><h2>Subscription</h2><p class="sub">${restaurant.subscription?.active?'ACTIVE':'NOT ACTIVE'}${restaurant.subscription?.trial?' • Trial':''}</p><button class="btn primary" onclick="activate()">₹3,499 / Year — Activate</button></section>`
};
function orderRow(o){return `<div class="order"><div><b>#${o.id} • Table ${o.table}</b><div class="sub">${o.items.map(i=>i.n+' × '+i.q).join(' • ')}</div></div><span class="badge ${o.status==='New'?'new':o.status==='Preparing'?'prep':o.status==='Ready'?'ready':'done'}">${o.status}${o.eta?' • '+o.eta+'m':''}</span></div>`}
function addCart(id){let m=menu.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.q++:cart.push({...m,q:1});render()}
function chg(id,d){let x=cart.find(y=>y.id===id);if(!x)return;x.q+=d;if(x.q<=0)cart=cart.filter(y=>y.id!==id);render()}
function sendKOT(){if(!cart.length)return alert('Cart is empty');let sub=cart.reduce((a,x)=>a+x.p*x.q,0),tax=sub*restaurant.tax/100;orders.push({id:Date.now(),table:selectedTable,status:'New',items:cart.map(x=>({...x})),subtotal:sub,tax,total:sub+tax,source:'POS',createdAt:Date.now()});let t=tables.find(x=>x.n===selectedTable);if(t)t.status='occupied';cart=[];persist();go('orders')}
function accept(id){openModal(`<h2>Accept Order #${id}</h2><p class="sub">Chef sets preparation time.</p><input id="eta" type="number" min="1" value="20"><button class="btn primary" style="width:100%;margin-top:10px" onclick="start(${id})">CONFIRM & START</button>`)}
function start(id){let o=orders.find(x=>x.id===id);o.status='Preparing';o.eta=+eta.value||20;o.startedAt=Date.now();persist();closeModal();render()}
function ready(id){let o=orders.find(x=>x.id===id);o.status='Ready';persist();render()}
function complete(id){let o=orders.find(x=>x.id===id);o.status='Completed';let t=tables.find(x=>x.n===o.table);if(t)t.status='free';persist();render()}
function bill(id){let o=orders.find(x=>x.id===id),payment=prompt('Payment: Cash / UPI / Card','UPI')||'UPI';bills.push({id:o.id,total:o.total,payment,date:Date.now()});persist();alert('Bill recorded');render()}
function toggleTable(n){let t=tables.find(x=>x.n===n);t.status=t.status==='free'?'occupied':'free';persist();render()}
function addTable(){let n=tables.length+1;tables.push({n,status:'free',token:token()});persist();render()}
function menuModal(){openModal(`<h2>Add Menu Item</h2><input id="mn" placeholder="Item name"><input id="mp" type="number" placeholder="Price"><input id="mc" placeholder="Category"><button class="btn primary" style="width:100%;margin-top:8px" onclick="menu.push({id:Date.now(),n:mn.value,p:+mp.value,c:mc.value||'Food',active:true});persist();closeModal();render()">SAVE</button>`)}
function stockModal(){openModal(`<h2>Add Inventory</h2><input id="sn" placeholder="Ingredient"><input id="sq" type="number" placeholder="Quantity"><input id="su" placeholder="Unit"><input id="smin" type="number" placeholder="Minimum"><button class="btn primary" style="width:100%;margin-top:8px" onclick="stock.push({n:sn.value,q:+sq.value||0,u:su.value||'pcs',min:+smin.value||0});persist();closeModal();render()">SAVE</button>`)}
function custModal(){openModal(`<h2>Add Customer</h2><input id="cn" placeholder="Name"><input id="cp" placeholder="Phone"><button class="btn primary" style="width:100%;margin-top:8px" onclick="customers.push({n:cn.value,p:cp.value,s:0});persist();closeModal();render()">SAVE</button>`)}
function openModal(s){document.getElementById('modal').innerHTML=`<div class="modal"><div class="modalbox">${s}<button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Cancel</button></div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function render(){if(!logged)return login();document.getElementById('root').innerHTML=shell();document.getElementById('content').innerHTML=views[page]()}
render();
</script>
</body></html>
