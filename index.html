<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06294c">
<meta name="mobile-web-app-capable" content="yes">
<title>WEBLYFT Restaurant OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--nav:#06294c;--nav2:#041d35;--blue:#0872ee;--cyan:#18b9df;--green:#18a467;--red:#df4d57;--orange:#e99b19;--bg:#f4f7fb;--card:#fff;--line:#dfe7ef;--text:#10243e;--mut:#718096}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:active{transform:scale(.985)}
.hidden{display:none!important}.mut{color:var(--mut)}.small{font-size:11px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800}.primary{background:var(--blue);color:#fff}.success{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.soft{background:#eaf1f8;color:#173b5d}.outline{background:#fff;border:1px solid var(--line);color:#173b5d}
.auth{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#e0efff,#f7f9fb 55%)}.authbox{width:min(440px,94vw);background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 25px 90px #06294c1a}.brand{font-weight:950;color:var(--nav);font-size:25px;letter-spacing:.5px}.brand span{color:var(--blue)}
.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;margin:5px 0;outline:none}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0872ee15}
.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:30}.topright{display:flex;align-items:center;gap:8px}.layout{display:grid;grid-template-columns:225px 1fr}.side{background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;min-height:calc(100vh - 62px);padding:15px;position:sticky;top:62px}.side small{color:#abc1d8}.rid{padding:11px;background:#ffffff12;border-radius:9px;margin:15px 0;font-size:11px}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#dbe7f2;border-radius:8px;padding:10px;margin:2px 0}.nav button:hover,.nav button.active{background:var(--blue);color:#fff}
.main{padding:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.head h1{margin:0;font-size:24px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 4px 18px #06294c09}.metric small{color:var(--mut);font-size:11px}.metric strong{display:block;font-size:24px;margin:7px 0}.sub{background:linear-gradient(135deg,#0872ee,#0756c9);color:#fff}.sub small{color:#dceaff}.grid3{display:grid;grid-template-columns:1.3fr 1fr .75fr;gap:10px;margin-top:10px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:7px}.quick button{padding:13px;background:#fff;border:1px solid var(--line);border-radius:8px;font-weight:800}.bars{height:175px;display:flex;align-items:end;gap:9px}.bar{flex:1;background:linear-gradient(#0872ee,#43b8ed);border-radius:5px 5px 0 0}.bar span{display:block;text-align:center;transform:translateY(16px);font-size:9px;color:var(--mut)}
.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left}.status{font-size:9px;font-weight:900;padding:5px 8px;border-radius:12px}.new{background:#eaf3ff;color:#0868d7}.prep{background:#fff1d4;color:#9a6800}.ready{background:#e5f8ef;color:#16804c}.served{background:#eef1f5;color:#687688}
.pos{display:grid;grid-template-columns:1fr 340px;gap:10px}.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px}.tabs{display:flex;gap:6px;overflow:auto;margin:8px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:15px;padding:8px 12px;font-size:11px}.tabs .on{background:var(--blue);color:#fff}.foodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.food{background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px;text-align:left}.food b{display:block}.food small{display:block;color:var(--mut);margin:5px 0}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 7px;text-align:center}.tile b{display:block;font-size:16px}.tile small{color:var(--mut)}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.col{background:#e8eef5;padding:10px;border-radius:10px}.order{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;margin:7px 0}.line{display:flex;justify-content:space-between;gap:7px;padding:8px 0;border-bottom:1px solid #edf1f5;font-size:11px}.eta{font-size:27px;text-align:center;font-weight:900;color:var(--blue);padding:8px}
.modal{position:fixed;inset:0;background:#00172d99;display:grid;place-items:center;padding:14px;z-index:100}.box{background:#fff;border-radius:14px;width:min(540px,95vw);max-height:92vh;overflow:auto;padding:20px}.close{float:right;border:0;background:#edf2f7;border-radius:50%;width:29px;height:29px}
.customer{max-width:700px;margin:auto}.chead{height:62px;background:var(--nav);color:#fff;padding:12px 15px;position:sticky;top:0;z-index:20}.wrap{padding:13px 13px 90px}.hero{background:linear-gradient(135deg,#0872ee,#16b8df);color:#fff;padding:20px;border-radius:13px;margin-bottom:9px}.hero h1{margin:5px 0;font-size:23px}.citem{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:7px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.cartbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(670px,94vw);background:var(--blue);color:#fff;border-radius:10px;padding:12px;z-index:30}.timer{font-size:46px;text-align:center;font-weight:950;color:var(--blue)}.timeline{display:flex;justify-content:space-between;margin:23px 0}.node{text-align:center;font-size:10px;color:var(--mut)}.node.on{color:var(--green);font-weight:900}
.notice{padding:11px;border-radius:9px;background:#fff8df;border:1px solid #f0dc98;color:#795d09;font-size:11px;margin:10px 0}.successBox{padding:11px;border-radius:9px;background:#e9f9f1;color:#137648;font-size:11px}.qrbox{display:grid;place-items:center;padding:15px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.top{height:58px;padding:0 10px}.layout{display:block}.side{display:none}.main{padding:10px}.cards{grid-template-columns:1fr 1fr;gap:7px}.card{padding:12px}.grid3,.pos,.kanban{grid-template-columns:1fr}.foodgrid{grid-template-columns:1fr 1fr}.tgrid{grid-template-columns:1fr 1fr}.head h1{font-size:20px}.metric strong{font-size:20px}.topright .btn{padding:8px}.customer .wrap{padding:10px 10px 90px}.hero h1{font-size:21px}}
@media(max-width:380px){.cards{grid-template-columns:1fr}.foodgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* WEBLYFT FINAL HTML APP
   - Phone-first responsive UI
   - Owner/POS/Kitchen/Tables/QR/Menu/Reports/Settings/Subscription
   - Customer QR menu + cart + tax + range check
   - Browser-local data store for standalone HTML operation
   - QR generation uses QRCode.js CDN. Internet is required for QR generation in this single-file build.
*/
const KEY="WEBLYFT_FINAL_V1";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{restaurants:[],orders:[],session:null};
let page="dashboard",cart=[],pcat="All",pq="";
const SUPABASE_URL="https://gpolqilwfxgssxrixpqe.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_c-xQEXAygNy1J8_0YXNjwg_f2Lu-xJe";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
async function cloudRegister(name,owner,email,phone,password,tables){
 const {data,error}=await sb.auth.signUp({email,password}); if(error)throw error;
 if(!data.user)throw new Error("No user returned");
 const {data:p,error:e}=await sb.rpc("create_restaurant_profile",{p_name:name,p_owner_name:owner,p_email:email,p_phone:phone,p_table_count:tables});
 if(e)throw e; return p;
}
async function cloudLogin(email,password){
 const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error)throw error;
 const {data:s,error:se}=await sb.from("staff").select("restaurant_id,name,role,is_active").eq("id",data.user.id).single(); if(se)throw se;
 const {data:r,error:re}=await sb.from("restaurants").select("*").eq("id",s.restaurant_id).single(); if(re)throw re;
 return r;
}
async function loadCloud(r){
 const [t,m,c]=await Promise.all([
  sb.from("restaurant_tables").select("*").eq("restaurant_id",r.id).order("table_number"),
  sb.from("menu_items").select("*").eq("restaurant_id",r.id).order("created_at"),
  sb.from("subscriptions").select("*").eq("restaurant_id",r.id).order("created_at",{ascending:false}).limit(1)
 ]);
 if(t.error)throw t.error;if(m.error)throw m.error;if(c.error)throw c.error;
 r.tables=(t.data||[]).map(x=>({no:x.table_number,id:x.id,token:x.qr_token,status:x.status==="occupied"?"Occupied":x.status==="reserved"?"Reserved":"Available"}));
 r.menu=(m.data||[]).map(x=>({id:x.id,name:x.name,cat:"Menu",desc:x.description||"",price:Number(x.price),active:x.is_available}));
 const s=c.data?.[0];r.subscription={active:s?.status==="active",until:s?.expires_at?new Date(s.expires_at).getTime():null};save();
}

const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const money=n=>"₹"+Math.round(n||0).toLocaleString("en-IN");
const rid=()=>`WL-${Math.floor(100000+Math.random()*900000)}`;
const token=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36)+Date.now().toString(36);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function auth(){
$("app").innerHTML=`<div class=auth><div class=authbox>
<div class=brand style="text-align:center">WEB<span>LYFT</span></div>
<h2 style="text-align:center;margin-bottom:4px">Restaurant OS</h2>
<p class=mut style="text-align:center">Owner • POS • Kitchen • QR • Billing</p>
<input class=field id=li placeholder="Email / Restaurant ID">
<input class=field id=lp type=password placeholder="Password">
<button class="btn primary" style="width:100%;margin-top:6px" onclick=login()>LOGIN</button>
<button class="btn outline" style="width:100%;margin-top:7px" onclick=registerView()>CREATE RESTAURANT</button>
</div></div>`;
}
function registerView(){
$("app").innerHTML=`<div class=auth><div class=authbox>
<div class=brand style="text-align:center">WEB<span>LYFT</span></div><h2 style="text-align:center">Create Restaurant</h2>
<input class=field id=rn placeholder="Restaurant name">
<input class=field id=ro placeholder="Owner name">
<input class=field id=re type=email placeholder="Email">
<input class=field id=rp placeholder="Mobile">
<input class=field id=rpass type=password placeholder="Password">
<input class=field id=nt type=number value=12 placeholder="Number of tables">
<button class="btn primary" style="width:100%;margin-top:5px" onclick=register()>CREATE ACCOUNT</button>
<button class="btn outline" style="width:100%;margin-top:7px" onclick=auth()>BACK</button>
</div></div>`;
}
async function register(){
 if(!rn.value||!ro.value||!re.value||!rpass.value)return alert("Fill all required fields.");
 if(rpass.value.length<6)return alert("Password must be at least 6 characters.");
 try{
  const r=await cloudRegister(rn.value.trim(),ro.value.trim(),re.value.trim(),rp.value.trim(),rpass.value,+nt.value||12);
  db.session=r.id;
  db.restaurants.push({id:r.id,name:r.name,owner:r.owner_name,email:r.email,phone:r.phone,tax:r.tax_percent,range:r.ordering_radius_m,lat:r.latitude,lng:r.longitude,subscription:{active:false,until:null},tables:[],menu:[]});
  save(); await loadCloud(current()); owner();
 }catch(e){alert("Registration failed: "+e.message);}
}
async function login(){
 try{
  const r=await cloudLogin(li.value.trim(),lp.value);
  db.session=r.id;db.restaurants=db.restaurants.filter(x=>x.id!==r.id);
  db.restaurants.push({id:r.id,name:r.name,owner:r.owner_name,email:r.email,phone:r.phone,tax:r.tax_percent,range:r.ordering_radius_m,lat:r.latitude,lng:r.longitude,subscription:{active:false,until:null},tables:[],menu:[]});
  save();await loadCloud(current());owner();
 }catch(e){alert("Login failed: "+e.message);}
}
async function logout(){await sb.auth.signOut();db.session=null;save();auth();}
function current(){return db.restaurants.find(r=>r.id===db.session)}
function logout(){db.session=null;save();auth()}
const nav=[["dashboard","▦","Dashboard"],["pos","▣","POS / Billing"],["orders","◉","Orders"],["kitchen","♨","Kitchen / KOT"],["tables","▦","Tables & QR"],["menu","☷","Menu"],["inventory","◒","Inventory"],["reports","◔","Reports"],["customers","♙","Customers"],["settings","⚙","Settings"],["subscription","◆","Subscription"]];
function shell(r){
return `<div class=top><div class=brand>WEB<span>LYFT</span> <small class=mut>Restaurant OS</small></div>
<div class=topright><b class=small>${esc(r.name)}</b><button class="btn soft" onclick=logout()>Logout</button></div></div>
<div class=layout><aside class=side><b style="font-size:18px">WEBLYFT</b><small style="display:block">Restaurant Operating System</small>
<div class=rid><b>${esc(r.name)}</b><br><small>Restaurant ID • ${r.id}</small></div>
<div class=nav>${nav.map(n=>`<button class="${page===n[0]?"active":""}" onclick="go('${n[0]}')">${n[1]} &nbsp; ${n[2]}</button>`).join("")}</div>
</aside><main class=main id=main></main></div>`;
}
async function owner(){let r=current();$("app").innerHTML=shell(r);try{await loadCloud(r);$("app").innerHTML=shell(r);render()}catch(e){render();console.warn(e)}}
function go(p){page=p;owner()}
function render(){let f={dashboard,pos,orders,kitchen,tables,menu,inventory,reports,customers,settings,subscription}[page];let out=f();if(out instanceof Promise)out.then(x=>main.innerHTML=x);else main.innerHTML=out}
function getOrders(){return db.orders.filter(o=>o.rid===current().id).sort((a,b)=>b.id-a.id)}
function dashboard(){
let r=current(),o=getOrders(),sales=o.reduce((a,x)=>a+x.total,0),pending=o.filter(x=>!["Ready","Served"].includes(x.status)).length,occ=r.tables.filter(t=>t.status==="Occupied").length;
return `<div class=head><div><h1>Dashboard</h1><small class=mut>Live restaurant overview</small></div><button class="btn primary" onclick=go('pos')>+ NEW ORDER</button></div>
<div class=cards><div class="card metric"><small>Today's Sales</small><strong>${money(sales)}</strong><span style="color:var(--green)">LIVE</span></div>
<div class="card metric"><small>Total Orders</small><strong>${o.length}</strong></div><div class="card metric"><small>Pending Orders</small><strong>${pending}</strong></div>
<div class="card metric"><small>Occupied Tables</small><strong>${occ} / ${r.tables.length}</strong></div>
<div class="card metric sub"><small>WEBLYFT SUBSCRIPTION</small><strong>₹3,499 / YEAR</strong><span>365 days</span></div></div>
<div class=grid3><section class=card><h3>LIVE ORDERS</h3>${o.slice(0,7).map(x=>`<div class=line><b>#${x.id}</b><span>Table ${x.table}</span><span>${money(x.total)}</span><span class="status ${x.status==="New"?"new":x.status==="Preparing"?"prep":x.status==="Ready"?"ready":"served"}">${x.status}</span></div>`).join("")||"<p class=mut>No orders yet.</p>"}</section>
<section class=card><h3>SALES OVERVIEW</h3><div class=bars>${[30,48,41,63,53,75,88].map((h,i)=>`<div class=bar style="height:${h}%"><span>${"MTWTFSS"[i]}</span></div>`).join("")}</div></section>
<section class=card><h3>QUICK ACTIONS</h3><div class=quick><button onclick=go('pos')>New Bill</button><button onclick=go('kitchen')>Kitchen</button><button onclick=go('tables')>Tables & QR</button><button onclick=go('menu')>Menu</button></div></section></div>`;
}
function pos(){
let r=current(),cats=["All",...new Set(r.menu.map(x=>x.cat))],items=r.menu.filter(x=>x.active&&(pcat==="All"||x.cat===pcat)&&x.name.toLowerCase().includes(pq.toLowerCase())),sub=cart.reduce((a,x)=>a+x.price*x.qty,0),tax=sub*r.tax/100;
return `<div class=head><div><h1>POS / Billing</h1><small class=mut>Manual order → KOT</small></div></div><div class=pos>
<section class=card><input class=search value="${esc(pq)}" placeholder="Search menu..." oninput="pq=this.value;render()"><div class=tabs>${cats.map(c=>`<button class="${pcat===c?'on':''}" onclick="pcat='${esc(c)}';render()">${esc(c)}</button>`).join("")}</div>
<div class=foodgrid>${items.map(m=>`<button class=food onclick="addCart(${m.id})"><b>${esc(m.name)}</b><small>${esc(m.cat)}</small><strong>${money(m.price)}</strong></button>`).join("")}</div></section>
<section class=card><div class=line><b>TABLE</b><select id=pt>${r.tables.map(t=>`<option value="${t.no}">Table ${t.no}</option>`).join("")}</select></div>
${cart.map(x=>`<div class=line><span>${esc(x.name)} × ${x.qty}</span><b>${money(x.price*x.qty)}</b></div>`).join("")||"<p class=mut>Cart empty.</p>"}
<div class=line><span>Subtotal</span><b>${money(sub)}</b></div><div class=line><span>Tax (${r.tax}%)</span><b>${money(tax)}</b></div>
<div class=line style="font-size:18px"><b>Total</b><b>${money(sub+tax)}</b></div>
<button class="btn primary" style="width:100%;margin-top:10px" onclick=sendPOS()>SEND TO KITCHEN</button></section></div>`;
}
function addCart(id){let m=current().menu.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({...m,qty:1});render()}
function sendPOS(){if(!cart.length)return alert("Cart is empty.");let r=current(),sub=cart.reduce((a,x)=>a+x.price*x.qty,0),tax=sub*r.tax/100,o={id:Date.now(),rid:r.id,table:+pt.value,items:cart.map(x=>({name:x.name,price:x.price,qty:x.qty})),subtotal:sub,tax,total:sub+tax,status:"New",eta:null,created:Date.now(),source:"POS"};db.orders.push(o);let t=r.tables.find(t=>t.no===+pt.value);if(t)t.status="Occupied";save();cart=[];go("orders")}
function orders(){
let o=getOrders();return `<div class=head><div><h1>Orders</h1><small class=mut>Customer QR + POS orders</small></div></div><div class=card><table class=table><tr><th>ORDER</th><th>TABLE</th><th>ITEMS</th><th>TOTAL</th><th>STATUS</th><th>ACTION</th></tr>
${o.map(x=>`<tr><td>#${x.id}</td><td>${x.table}</td><td>${x.items.map(i=>esc(i.name)+" × "+i.qty).join(", ")}</td><td>${money(x.total)}</td><td><span class="status ${x.status==="New"?"new":x.status==="Preparing"?"prep":x.status==="Ready"?"ready":"served"}">${x.status}</span></td><td>
${x.status==="New"?`<button class="btn success" onclick=accept(${x.id})>ACCEPT</button>`:x.status==="Preparing"?`<button class="btn primary" onclick="statusOrder(${x.id},'Ready')">READY</button>`:x.status==="Ready"?`<button class="btn soft" onclick="statusOrder(${x.id},'Served')">SERVED</button>`:""}</td></tr>`).join("")||"<tr><td colspan=6>No orders</td></tr>"}</table></div>`;
}
function accept(id){let x=db.orders.find(o=>o.id===id),eta=prompt("Chef preparation time (minutes)","20");if(eta===null)return;x.status="Preparing";x.eta=Math.max(1,+eta||20);x.started=Date.now();save();go("kitchen")}
function statusOrder(id,s){let x=db.orders.find(o=>o.id===id);x.status=s;if(s==="Served"){let r=current(),t=r.tables.find(t=>t.no===x.table);if(t)t.status="Available"}save();render()}
function kitchen(){
let o=getOrders(),cols=["New","Preparing","Ready"];return `<div class=head><div><h1>Kitchen / KOT</h1><small class=mut>Preparation board</small></div></div><div class=kanban>${cols.map(c=>`<section class=col><h3>${c.toUpperCase()}</h3>
${o.filter(x=>x.status===c).map(x=>`<div class=order><div class=line><b>#${x.id}</b><span>Table ${x.table}</span></div><ul>${x.items.map(i=>`<li>${i.qty} × ${esc(i.name)}</li>`).join("")}</ul>
${c==="New"?`<button class="btn success" style="width:100%" onclick=accept(${x.id})>ACCEPT + SET ETA</button>`:c==="Preparing"?`<div class=eta>${x.eta} min</div><button class="btn primary" style="width:100%" onclick="statusOrder(${x.id},'Ready')">ORDER READY</button>`:`<button class="btn soft" style="width:100%" onclick="statusOrder(${x.id},'Served')">MARK SERVED</button>`}</div>`).join("")||"<p class=mut>Empty</p>"}</section>`).join("")}</div>`;
}
function tables(){
let r=current();return `<div class=head><div><h1>Tables & QR</h1><small class=mut>One unique QR per table</small></div><button class="btn primary" onclick=addTable()>+ ADD TABLE</button></div>
<div class=tgrid>${r.tables.map(t=>`<button class=tile onclick="showQR(${t.no})"><b>Table ${String(t.no).padStart(2,"0")}</b><small>${t.status}</small></button>`).join("")}</div>
<div class=card style="margin-top:10px"><b>Ordering range:</b> ${r.range}m • ${r.lat!==null?"GPS configured":"GPS not configured"}</div>`;
}
function addTable(){let r=current(),n=+prompt("Table number");if(!n||r.tables.some(t=>t.no===n))return alert("Invalid/already existing table.");r.tables.push({no:n,token:token(),status:"Available"});save();render()}
function customerURL(r,t){let u=new URL(location.href);u.search="";u.hash="";u.searchParams.set("customer","1");u.searchParams.set("rid",r.id);u.searchParams.set("table",t.no);u.searchParams.set("token",t.token);return u.href}
function showQR(n){
let r=current(),t=r.tables.find(x=>x.no===n),url=customerURL(r,t);
open(`<button class=close onclick=close()>×</button><h2>Table ${n} QR</h2><div class=qrbox><div id=qrcode></div></div><p class=mut style="text-align:center">Restaurant ${r.id} • Table ${n}</p>
<div class=notice>Scan this QR from a customer's phone. It opens the exact restaurant + exact table menu.</div>
<button class="btn primary" style="width:100%" onclick="navigator.clipboard?.writeText('${url.replaceAll("'","%27")}');alert('Customer link copied')">COPY CUSTOMER LINK</button>
<button class="btn soft" style="width:100%;margin-top:7px" onclick="location.href='${url.replaceAll("'","%27")}'">OPEN CUSTOMER MENU</button></div>`);
setTimeout(()=>{let q=$("qrcode");if(q&&window.QRCode)new QRCode(q,{text:url,width:260,height:260,colorDark:"#06294c",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H})},50);
}
function menu(){
let r=current();return `<div class=head><div><h1>Menu Management</h1><small class=mut>Customer-facing menu</small></div><button class="btn primary" onclick=addMenu()>+ ADD ITEM</button></div><div class=card>
${r.menu.map(m=>`<div class=line><span><b>${esc(m.name)}</b><small style="display:block;color:#718096">${esc(m.cat)} • ${money(m.price)} • ${esc(m.desc)}</small></span><span><span class="status ${m.active?'ready':'served'}">${m.active?'LIVE':'OFF'}</span> <button class="btn soft" onclick=toggleMenu(${m.id})>Toggle</button> <button class="btn outline" onclick=editMenu(${m.id})>Edit</button></span></div>`).join("")}</div>`;
}
function addMenu(id){let r=current(),m=id?r.menu.find(x=>x.id===id):{name:"",cat:"Starters",desc:"",price:0,active:true};open(`<button class=close onclick=close()>×</button><h2>${id?"Edit":"Add"} Menu Item</h2><input class=field id=mn value="${esc(m.name)}" placeholder="Item name"><input class=field id=mc value="${esc(m.cat)}" placeholder="Category"><input class=field id=mp type=number value="${m.price}" placeholder="Price"><textarea class=field id=md placeholder="Description">${esc(m.desc)}</textarea><button class="btn primary" onclick=saveMenu(${id||0})>SAVE ITEM</button>`)}
function editMenu(id){addMenu(id)}
function saveMenu(id){let r=current(),m={name:mn.value.trim(),cat:mc.value.trim()||"Other",price:+mp.value||0,desc:md.value.trim(),active:true};if(!m.name)return alert("Item name required.");if(id)Object.assign(r.menu.find(x=>x.id===id),m);else{m.id=Date.now();r.menu.push(m)}save();close();render()}
function toggleMenu(id){let m=current().menu.find(x=>x.id===id);m.active=!m.active;save();render()}
function inventory(){return `<div class=head><div><h1>Inventory</h1><small class=mut>Stock workspace</small></div></div><div class=card><h3>Inventory foundation</h3><p>Use this module for ingredients, stock entries, low-stock thresholds and purchase records.</p><p class=mut>For true multi-device inventory sync, this HTML build must be connected to a cloud backend.</p></div>`}
function reports(){let o=getOrders(),sales=o.reduce((a,x)=>a+x.total,0),tax=o.reduce((a,x)=>a+x.tax,0);return `<div class=head><div><h1>Reports</h1><small class=mut>Restaurant performance</small></div></div><div class=cards><div class="card metric"><small>Total Sales</small><strong>${money(sales)}</strong></div><div class="card metric"><small>Total Orders</small><strong>${o.length}</strong></div><div class="card metric"><small>Tax Collected</small><strong>${money(tax)}</strong></div><div class="card metric"><small>Average Order</small><strong>${money(o.length?sales/o.length:0)}</strong></div><div class="card metric"><small>Tables</small><strong>${current().tables.length}</strong></div></div>`}
function customers(){let o=getOrders(),names=[...new Set(o.map(x=>x.name).filter(Boolean))];return `<div class=head><div><h1>Customers</h1><small class=mut>Customer activity</small></div></div><div class=card>${names.length?names.map(n=>`<div class=line><b>${esc(n)}</b><span>Customer</span></div>`).join(""):"<p class=mut>No named customers yet. Customer names are optional at QR checkout.</p>"}</div>`}
function settings(){let r=current();return `<div class=head><div><h1>Settings</h1><small class=mut>Tax + geofence</small></div></div><div class=card><input class=field id=sn value="${esc(r.name)}" placeholder="Restaurant name"><input class=field id=st type=number value="${r.tax}" placeholder="Tax %"><input class=field id=sr type=number value="${r.range}" placeholder="Ordering range in meters"><input class=field id=slat type=number step=any value="${r.lat??""}" placeholder="Restaurant latitude"><input class=field id=slng type=number step=any value="${r.lng??""}" placeholder="Restaurant longitude"><button class="btn soft" onclick=getLocation()>USE CURRENT LOCATION</button> <button class="btn primary" onclick=saveSettings()>SAVE SETTINGS</button><p class=mut>Customer orders can be blocked outside the configured radius.</p></div>`}
function getLocation(){if(!navigator.geolocation)return alert("Geolocation unavailable.");navigator.geolocation.getCurrentPosition(p=>{slat.value=p.coords.latitude;slng.value=p.coords.longitude},()=>alert("Allow location permission."))}
function saveSettings(){let r=current();r.name=sn.value;r.tax=Math.max(0,+st.value||0);r.range=Math.max(1,+sr.value||100);r.lat=slat.value?+slat.value:null;r.lng=slng.value?+slng.value:null;save();owner();alert("Settings saved.")}
function subscription(){
let r=current(),active=r.subscription.active&&(!r.subscription.until||r.subscription.until>Date.now());
return `<div class=head><div><h1>WEBLYFT Subscription</h1><small class=mut>₹3,499 • 365 days</small></div></div><div class=card style="max-width:680px">
<div style="background:linear-gradient(135deg,#0872ee,#0755ca);color:#fff;border-radius:12px;padding:25px"><small>WEBLYFT SERVICE PLAN</small><h1>₹3,499 / YEAR</h1><p>365 days • Restaurant OS</p><div class="${active?'successBox':'notice'}">${active?"Subscription ACTIVE":"Subscription not active"}</div><button class="btn" style="background:#fff;color:#0755ca;margin-top:10px" onclick=subscriptionInfo()>PAY / RENEW ₹3,499</button></div>
<p class=mut><b>Payment separation:</b> this subscription is for WEBLYFT service. Customer food-order payments are separate.</p>
<div class=notice><b>Payment gateway connection:</b> this standalone HTML cannot securely verify a real merchant payment by itself. The merchant ID must be kept server-side and the gateway webhook must confirm payment before activating 365 days.</div></div>`;
}
async function subscriptionInfo(){
open(`<button class=close onclick="close()">×</button>
<h2>₹3,499 WEBLYFT Subscription</h2>
<p>365-day WEBLYFT service subscription.</p>
<div class=notice><b>PhonePe checkout</b><br>This uses the secure backend endpoint <code>/api/subscription/create</code>. Merchant credentials stay on the server and are never placed in this HTML.</div>
<button id=payBtn class="btn primary" style="width:100%;margin-top:8px">CONTINUE TO PHONEPE</button>
<button class="btn outline" style="width:100%;margin-top:7px" onclick="close()">CANCEL</button>`);
$("payBtn").onclick=async()=>{
  const r=current(),b=$("payBtn");
  b.disabled=true;b.textContent="CONNECTING…";
  try{
    const res=await fetch("/api/subscription/create",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({restaurantId:r.id,amount:3499,validityDays:365})
    });
    if(!res.ok) throw new Error("Backend unavailable");
    const j=await res.json();
    if(!j.checkoutUrl) throw new Error("No checkout URL returned");
    location.href=j.checkoutUrl;
  }catch(e){
    b.disabled=false;b.textContent="CONTINUE TO PHONEPE";
    alert("PhonePe backend is not connected yet. Subscription was NOT activated.");
  }
};
}
function open(x){$("modal").innerHTML=`<div class=modal onclick="if(event.target===this)close()"><div class=box>${x}</div></div>`}
function close(){$("modal").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

function distance(a,b,c,d){let R=6371000,p=Math.PI/180,da=(c-a)*p,db=(d-b)*p,x=Math.sin(da/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(db/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
async function customer(){
let p=new URLSearchParams(location.search);
let rid=p.get("rid"),tableNo=Number(p.get("table")),token=p.get("token");
if(!rid||!tableNo||!token){
 $("app").innerHTML=`<div class=wrap><div class=hero><h1>Invalid QR</h1><p>This QR link is missing restaurant or table information.</p></div></div>`;
 return;
}
$("app").innerHTML=`<div class=wrap><div class=card style="text-align:center"><h2>Loading menu…</h2><p class=mut>Connecting to WEBLYFT</p></div></div>`;
try{
 const {data,error}=await sb.rpc("get_public_qr_menu",{
   p_restaurant_id:rid,p_table_number:tableNo,p_qr_token:token
 });
 if(error)throw error;
 if(!data||!data.restaurant||!data.table)throw new Error("Invalid QR");
 let r={
   id:data.restaurant.id,name:data.restaurant.name,tax:Number(data.restaurant.tax_percent||0),
   range:Number(data.restaurant.ordering_radius_m||100),
   lat:data.restaurant.latitude,lng:data.restaurant.longitude
 };
 let t={no:Number(data.table.table_number),id:data.table.id,token:data.table.qr_token,status:data.table.status};
 r.menu=(data.menu||[]).map(m=>({
   id:m.id,name:m.name,cat:m.category||"Other",desc:m.description||"",
   price:Number(m.price||0),active:!!m.is_available
 }));
 let cc=[],cat="All",qq="",placed=null;

 function renderC(){
  let cats=["All",...new Set(r.menu.map(x=>x.cat))];
  let items=r.menu.filter(x=>x.active&&(cat==="All"||x.cat===cat)&&x.name.toLowerCase().includes(qq.toLowerCase()));
  let sub=cc.reduce((a,x)=>a+x.price*x.qty,0);
  $("app").innerHTML=`<div class=customer><header class=chead><b>${esc(r.name)}</b><small style="display:block;opacity:.75">TABLE ${t.no} • CONNECTED</small></header><main class=wrap>
  <div class=hero><small>WELCOME</small><h1>Order from your table</h1><p style="margin:0">Your QR is connected to Table ${t.no}.</p></div>
  <input class=search value="${esc(qq)}" placeholder="Search dishes..." oninput="window.__qrSearch(this.value)">
  <div class=tabs>${cats.map(c=>`<button class="${cat===c?'on':''}" onclick="window.__qrCat(${JSON.stringify(c)})">${esc(c)}</button>`).join("")}</div>
  ${items.map(m=>`<div class=citem><div><b>${esc(m.name)}</b><small style="display:block;color:#718096">${esc(m.cat)} • ${esc(m.desc)}</small><strong>${money(m.price)}</strong></div><button class="btn primary" onclick="window.__qrAdd('${m.id}')">ADD</button></div>`).join("")||"<p class=mut>No dishes found.</p>"}</main>
  ${cc.length?`<div class=cartbar><b>${cc.reduce((a,x)=>a+x.qty,0)} items • ${money(sub)}</b><button class=btn style="float:right;background:#fff;color:#0755ca" onclick=window.__qrCheckout()>VIEW CART</button></div>`:""}</div>`;
 }

 window.__qrSearch=v=>{qq=v;renderC()};
 window.__qrCat=v=>{cat=v;renderC()};
 window.__qrAdd=id=>{let m=r.menu.find(x=>String(x.id)===String(id)),x=cc.find(x=>x.id===id);x?x.qty++:cc.push({...m,qty:1});renderC()};

 window.__qrCheckout=()=>{
  let sub=cc.reduce((a,x)=>a+x.price*x.qty,0),tax=sub*r.tax/100;
  open(`<button class=close onclick=close()>×</button><h2>Cart • Table ${t.no}</h2>
  ${cc.map(x=>`<div class=line><span>${esc(x.name)} × ${x.qty}</span><b>${money(x.price*x.qty)}</b></div>`).join("")}
  <div class=line><span>Subtotal</span><b>${money(sub)}</b></div>
  <div class=line><span>Tax (${r.tax}%)</span><b>${money(tax)}</b></div>
  <div class=line><b>Total</b><b>${money(sub+tax)}</b></div>
  <input id=customerName class=field placeholder="Name (optional)">
  <textarea id=customerNote class=field placeholder="Special note"></textarea>
  <button class="btn primary" style="width:100%" onclick=window.__qrPlace()>PLACE ORDER</button>`);
 };

 window.__qrPlace=()=>{
  if(r.lat!==null&&r.lat!==undefined&&navigator.geolocation){
   navigator.geolocation.getCurrentPosition(
    pos=>finishC(pos.coords.latitude,pos.coords.longitude),
    ()=>alert("Location permission is required for ordering from this table.")
   );
  }else finishC(null,null);
 };

 async function finishC(lat,lng){
  if(r.lat!==null&&r.lat!==undefined&&r.lng!==null&&r.lng!==undefined){
   if(lat===null||lng===null)return alert("Location permission is required.");
   let d=distance(r.lat,r.lng,lat,lng);
   if(d>r.range)return alert("You are outside the restaurant's "+r.range+"m ordering range.");
  }
  let sub=cc.reduce((a,x)=>a+x.price*x.qty,0),tax=sub*r.tax/100;
  if(!cc.length)return alert("Your cart is empty.");
  try{
   const {data,error}=await sb.rpc("place_public_order",{
    p_restaurant_id:r.id,
    p_table_id:t.id,
    p_customer_name:$("customerName").value||null,
    p_customer_note:$("customerNote").value||null,
    p_subtotal:sub,
    p_tax_amount:tax,
    p_total:sub+tax,
    p_items:cc.map(x=>({menu_item_id:x.id,item_name:x.name,quantity:x.qty,unit_price:x.price,line_total:x.price*x.qty}))
   });
   if(error)throw error;
   close();
   placed={id:data.order_id,table:t.no,status:"New",eta:null,total:sub+tax};
   trackC();
  }catch(e){alert("Order could not be placed: "+e.message);}
 }

 function trackC(){
  $("app").innerHTML=`<div class=customer><header class=chead><b>${esc(r.name)}</b><small style="display:block">TABLE ${t.no} • ORDER #${esc(placed.id)}</small></header><main class=wrap><div class=card>
  <div class=timeline>${["New","Preparing","Ready","Served"].map((x,i)=>`<div class="node ${i===0?'on':''}" id="node-${i}"><div style="width:20px;height:20px;border-radius:50%;margin:auto;background:${i===0?'#19a66a':'#e3e9ef'}"></div>${x}</div>`).join("")}</div>
  <h2 style="text-align:center">Order received</h2><p class=mut style="text-align:center">Order #${esc(placed.id)} has been sent to the restaurant.</p>
  </div></main></div>`;
 }

 renderC();
}catch(e){
 $("app").innerHTML=`<div class=wrap><div class=hero><h1>Invalid QR</h1><p>This QR is not connected to a valid restaurant table.</p><small>${esc(e.message||"QR validation failed")}</small></div></div>`;
 console.error(e);
}
}

if(new URLSearchParams(location.search).get("customer"))customer();else if(db.session&&current())owner();else auth();
</script>
</body>
</html>
